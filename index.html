<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Firebase SDKs for Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #printable-invoice, #printable-invoice *, #printable-statement, #printable-statement * { visibility: visible; }
            #printable-invoice, #printable-statement {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-200 font-sans text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Configuration with your Database URL
        const firebaseConfig = {
            databaseURL: "https://divya-store-2a4b0-default-rtdb.firebaseio.com/"
        };
        
        let db = null;
        if (firebaseConfig.databaseURL) {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [showCheckoutModal, setShowCheckoutModal] = React.useState(false);
            const [showParchaModal, setShowParchaModal] = React.useState(false);
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            const [titleClicks, setTitleClicks] = React.useState(0);
            const handleTitleClick = () => {
                const newClicks = titleClicks + 1;
                setTitleClicks(newClicks);
                if (newClicks >= 3) {
                    setTitleClicks(0);
                    if (isAdminAuthenticated) {
                        alert("🔓 Aap pehle se Admin mode mein hain!");
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein:");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            alert("✅ Admin Access Successful!");
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN!");
                        }
                    }
                }
            };

            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("6200150688@ybl");

            const defaultItems = [
                { id: 1, name: "Aashirvaad Atta (10kg)", weight: "10 kg Pack", price: 420, category: "Groceries", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=400&q=80" },
                { id: 2, name: "Fortune Sunflower Oil", weight: "1 Litre Pouch", price: 135, category: "Groceries", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=400&q=80" },
                { id: 3, name: "Tata Iodized Salt", weight: "1 kg Pack", price: 28, category: "Groceries", image: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=400&q=80" },
                { id: 4, name: "DAP Khaad Fertilizer", weight: "50 kg Bag", price: 1350, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1628352081506-83c43123ed6d?auto=format&fit=crop&w=400&q=80" },
                { id: 5, name: "Urea Khaad Bag", weight: "45 kg Bag", price: 266, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=400&q=80" },
                { id: 6, name: "Certified Wheat Seed", weight: "40 kg Bag", price: 1400, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1574943320219-553eb213f72d?auto=format&fit=crop&w=400&q=80" },
                { id: 7, name: "Iron Nails (Lohe ki Kil)", weight: "1 kg Pack", price: 80, category: "Hardware", image: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=400&q=80" },
                { id: 8, name: "Heavy Claw Hammer", weight: "1 Piece", price: 180, category: "Hardware", image: "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=400&q=80" },
                { id: 9, name: "Disposable Pattal Thali", weight: "Pack of 50", price: 110, category: "Pattal & Glass", image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=400&q=80" },
                { id: 10, name: "Paper Tea/Water Glass", weight: "Pack of 100", price: 70, category: "Pattal & Glass", image: "https://images.unsplash.com/photo-1516594798947-e65505dbb29d?auto=format&fit=crop&w=400&q=80" },
                { id: 11, name: "Pashu Aahar (Cattle Feed)", weight: "50 kg Bag", price: 1250, category: "Pashupalan", image: "https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=400&q=80" },
                { id: 12, name: "Cattle Mineral Mixture", weight: "1 kg Pack", price: 150, category: "Pashupalan", image: "https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=400&q=80" }
            ];

            const [items, setItems] = React.useState(defaultItems);
            const [ordersList, setOrdersList] = React.useState([]);
            const [udhariList, setUdhariList] = React.useState([]);

            // Real-time Cloud Sync from Firebase
            React.useEffect(() => {
                if (db) {
                    db.ref('divya_store/items').on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) setItems(val);
                        else db.ref('divya_store/items').set(defaultItems);
                    });
                    db.ref('divya_store/orders').on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) setOrdersList(val);
                    });
                    db.ref('divya_store/udhari').on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) setUdhariList(val);
                        else {
                            const initialUdhari = [{ id: 1, name: "Ramesh Kumar", phone: "9876543210", amount: 450, note: "Chawal aur Dal baki", history: [{ date: "24/11/2026", type: "Udhari Liya", amount: 450, mode: "Udhari" }] }];
                            db.ref('divya_store/udhari').set(initialUdhari);
                        }
                    });
                }
            }, []);

            const updateCloudData = (path, data) => {
                if (db) {
                    db.ref(`divya_store/${path}`).set(data);
                }
            };

            const [searchTerm, setSearchTerm] = React.useState("");
            const [selectedCategory, setSelectedCategory] = React.useState("All");
            const [cart, setCart] = React.useState({});
            const [customerTime, setCustomerTime] = React.useState("10:00");
            const [customerName, setCustomerName] = React.useState("");
            const [customerPhone, setCustomerPhone] = React.useState("");
            const [paymentMode, setPaymentMode] = React.useState("Cash");
            const [checkoutUtrPin, setCheckoutUtrPin] = React.useState("");

            const [parchaName, setParchaName] = React.useState("");
            const [parchaPhone, setParchaPhone] = React.useState("");
            const [parchaText, setParchaText] = React.useState("");
            const [parchaExpectedPrice, setParchaExpectedPrice] = React.useState("");
            const [parchaImage, setParchaImage] = React.useState(null);

            const addToCart = (id) => setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) updated[id] -= 1;
                    else delete updated[id];
                    return updated;
                });
            };

            const getTotalItems = () => Object.values(cart).reduce((a, b) => a + b, 0);
            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const placeOrder = () => {
                if (!customerName || !customerPhone) {
                    alert("Kripya apna Naam aur Mobile Number likhein!");
                    return;
                }
                const totalAmt = getTotalAmount();
                const currentDate = new Date().toLocaleDateString('en-IN');
                const currentTime = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

                let billDetails = {
                    id: Date.now(),
                    invoiceNo: "INV-" + Math.floor(1000 + Math.random() * 9000),
                    customerName,
                    customerPhone,
                    pickupTime: customerTime,
                    paymentMode: paymentMode,
                    status: "Completed",
                    date: currentDate,
                    time: currentTime,
                    items: [],
                    total: totalAmt
                };

                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        billDetails.items.push({
                            name: item.name,
                            qty: cart[id],
                            price: item.price,
                            subtotal: item.price * cart[id]
                        });
                    }
                });

                const newOrders = [billDetails, ...ordersList];
                setOrdersList(newOrders);
                updateCloudData('orders', newOrders);
                
                setCart({});
                setShowCheckoutModal(false);
                setActiveTab('store');
                alert("🎉 Order Successfully Placed & Saved to Cloud!");
            };

            const placeParchaOrder = () => {
                if (!parchaName || !parchaPhone) {
                    alert("Kripya apna Naam aur Mobile Number zaroor dalein!");
                    return;
                }
                const currentDate = new Date().toLocaleDateString('en-IN');
                const currentTime = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                const expPrice = parseFloat(parchaExpectedPrice) || 0;

                let parchaOrderDetails = {
                    id: Date.now(),
                    invoiceNo: "PRC-" + Math.floor(1000 + Math.random() * 9000),
                    isParcha: true,
                    customerName: parchaName,
                    customerPhone: parchaPhone,
                    pickupTime: "As Soon As Ready",
                    paymentMode: "Payment Pending",
                    status: "Price Pending",
                    date: currentDate,
                    time: currentTime,
                    parchaText: parchaText || "Photo Parcha Uploaded",
                    parchaExpectedPrice: expPrice,
                    items: [{ name: parchaText || "Parcha Photo", qty: 1, price: expPrice, subtotal: expPrice }],
                    total: expPrice
                };

                const newOrders = [parchaOrderDetails, ...ordersList];
                setOrdersList(newOrders);
                updateCloudData('orders', newOrders);

                setParchaName("");
                setParchaPhone("");
                setParchaText("");
                setParchaExpectedPrice("");
                setShowParchaModal(false);
                alert("🎉 Parcha Order bhej diya gaya hai!");
            };

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-green-700 text-white p-4 shadow-md sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 onClick={handleTitleClick} className="text-xl font-bold cursor-pointer select-none">
                                🛒 Divya Kirana Store <span className="text-xs bg-green-800 px-2 py-0.5 rounded ml-2">Cloud Synced</span>
                            </h1>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab('store')} className={`px-3 py-1 rounded text-sm ${activeTab === 'store' ? 'bg-white text-green-700 font-bold' : 'bg-green-600'}`}>Store</button>
                                <button onClick={() => setActiveTab('orders')} className={`px-3 py-1 rounded text-sm ${activeTab === 'orders' ? 'bg-white text-green-700 font-bold' : 'bg-green-600'}`}>My Orders</button>
                                {isAdminAuthenticated && (
                                    <button onClick={() => setActiveTab('admin')} className={`px-3 py-1 rounded text-sm bg-yellow-500 text-black font-bold`}>Admin Dashboard</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4">
                        {activeTab === 'store' && (
                            <div>
                                <div className="bg-white p-4 rounded-lg shadow mb-4 flex justify-between items-center">
                                    <div>
                                        <h2 className="font-bold text-lg text-green-800">Welcome to Divya Kirana Store!</h2>
                                        <p className="text-sm text-gray-600">Order groceries, hardware, khad beej & cattle feed online.</p>
                                    </div>
                                    <button onClick={() => setShowParchaModal(true)} className="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-orange-600">
                                        📝 Upload Parcha
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                    {items.map(item => (
                                        <div key={item.id} className="bg-white p-3 rounded-lg shadow flex flex-col justify-between">
                                            <div>
                                                <img src={item.image} alt={item.name} className="w-full h-32 object-cover rounded mb-2" />
                                                <h3 className="font-bold text-gray-800">{item.name}</h3>
                                                <p className="text-xs text-gray-500">{item.weight}</p>
                                                <p className="text-green-700 font-bold mt-1">₹{item.price}</p>
                                            </div>
                                            <div className="mt-3">
                                                {cart[item.id] ? (
                                                    <div className="flex justify-between items-center bg-green-50 p-1 rounded">
                                                        <button onClick={() => removeFromCart(item.id)} className="bg-red-500 text-white px-2 py-0.5 rounded font-bold">-</button>
                                                        <span className="font-bold">{cart[item.id]}</span>
                                                        <button onClick={() => addToCart(item.id)} className="bg-green-600 text-white px-2 py-0.5 rounded font-bold">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(item.id)} className="w-full bg-green-600 text-white py-1.5 rounded font-bold hover:bg-green-700">Add to Cart</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {getTotalItems() > 0 && (
                                    <div className="fixed bottom-0 left-0 right-0 bg-green-800 text-white p-3 shadow-lg flex justify-between items-center max-w-4xl mx-auto rounded-t-lg z-40">
                                        <div>
                                            <span className="font-bold">{getTotalItems()} Items</span> | <span className="font-bold">Total: ₹{getTotalAmount()}</span>
                                        </div>
                                        <button onClick={() => setShowCheckoutModal(true)} className="bg-white text-green-800 px-6 py-2 rounded font-bold shadow">
                                            Checkout Now ➔
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'orders' && (
                            <div className="bg-white p-4 rounded-lg shadow">
                                <h2 className="text-xl font-bold mb-4 text-green-800">📦 Customer Orders & Tracking</h2>
                                {ordersList.length === 0 ? (
                                    <p className="text-gray-500">Koi order nahi mila.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {ordersList.map(ord => (
                                            <div key={ord.id} className="border p-3 rounded bg-gray-50 flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-green-800">{ord.invoiceNo} - {ord.customerName} ({ord.customerPhone})</p>
                                                    <p className="text-xs text-gray-500">Date: {ord.date} | Time: {ord.time}</p>
                                                    <p className="text-sm font-semibold mt-1">Total: ₹{ord.total} | Status: <span className="text-blue-600">{ord.status}</span></p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'admin' && isAdminAuthenticated && (
                            <div className="bg-white p-4 rounded-lg shadow">
                                <h2 className="text-xl font-bold mb-4 text-yellow-600">🛠️ Owner Admin Dashboard (Live Cloud)</h2>
                                <p className="text-sm text-gray-600 mb-4">Yahan saare orders aur udhari live sync ho rahe hain.</p>
                                <div className="space-y-4">
                                    <div className="bg-gray-50 p-3 rounded border">
                                        <h3 className="font-bold text-gray-700">Total Orders: {ordersList.length}</h3>
                                        <h3 className="font-bold text-gray-700 mt-2">Total Udhari Accounts: {udhariList.length}</h3>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Checkout Modal */}
                    {showCheckoutModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-5 rounded-lg max-w-md w-full">
                                <h3 className="text-lg font-bold mb-3 text-green-800">Complete Your Order</h3>
                                <input type="text" placeholder="Aapka Naam" value={customerName} onChange={e => setCustomerName(e.target.value)} className="w-full border p-2 rounded mb-3" />
                                <input type="text" placeholder="Mobile Number (10 Digit)" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full border p-2 rounded mb-3" />
                                <div className="flex justify-end gap-2 mt-4">
                                    <button onClick={() => setShowCheckoutModal(false)} className="bg-gray-400 text-white px-4 py-2 rounded">Cancel</button>
                                    <button onClick={placeOrder} className="bg-green-600 text-white px-4 py-2 rounded font-bold">Place Order</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Parcha Modal */}
                    {showParchaModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-5 rounded-lg max-w-md w-full">
                                <h3 className="text-lg font-bold mb-3 text-orange-600">📝 Upload Parcha Order</h3>
                                <input type="text" placeholder="Aapka Naam" value={parchaName} onChange={e => setParchaName(e.target.value)} className="w-full border p-2 rounded mb-3" />
                                <input type="text" placeholder="Mobile Number" value={parchaPhone} onChange={e => setParchaPhone(e.target.value)} className="w-full border p-2 rounded mb-3" />
                                <textarea placeholder="Parcha ki list yahan likhein..." value={parchaText} onChange={e => setParchaText(e.target.value)} className="w-full border p-2 rounded mb-3"></textarea>
                                <div className="flex justify-end gap-2 mt-4">
                                    <button onClick={() => setShowParchaModal(name => {})} onClick={() => setShowParchaModal(false)} className="bg-gray-400 text-white px-4 py-2 rounded">Cancel</button>
                                    <button onClick={placeParchaOrder} className="bg-orange-500 text-white px-4 py-2 rounded font-bold">Send Parcha</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
            ReactDOM.render(<App />, document.getElementById('root'));
        </script>
    </body>
</html>

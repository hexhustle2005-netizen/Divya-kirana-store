<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            // Secret Triple Tap Counter for Admin Access
            const [titleClicks, setTitleClicks] = React.useState(0);

            const handleTitleClick = () => {
                const newClicks = titleClicks + 1;
                setTitleClicks(newClicks);
                if (newClicks >= 3) {
                    setTitleClicks(0);
                    if (isAdminAuthenticated) {
                        alert("🔓 Aap pehle se Admin mode mein hain!");
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein:");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            alert("✅ Admin Access Successful! Ab aap Orders, Udhari, Rate aur Settings dekh sakte hain.");
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN!");
                        }
                    }
                }
            };

            // Shop Settings & Timing state
            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("divyakirana@upi");
            const [shopOpenTime, setShopOpenTime] = React.useState("08:00");
            const [shopCloseTime, setShopCloseTime] = React.useState("20:00");

            // Items list with images
            const [items, setItems] = React.useState([
                { id: 1, name: "Aashirvaad Atta (10kg)", price: 420, image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=300&q=80" },
                { id: 2, name: "Fortune Sunflower Oil (1L)", price: 135, image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=300&q=80" },
                { id: 3, name: "Tata Salt (1kg)", price: 28, image: "https://images.unsplash.com/photo-1518110991417-010777ea462f?auto=format&fit=crop&w=300&q=80" },
                { id: 4, name: "Surf Excel Detergent (1kg)", price: 140, image: "https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?auto=format&fit=crop&w=300&q=80" },
                { id: 5, name: "Colgate Toothpaste", price: 95, image: "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=300&q=80" }
            ]);

            const [cart, setCart] = React.useState({});
            const [customerTime, setCustomerTime] = React.useState("10:00");
            const [customerName, setCustomerName] = React.useState("");
            const [customerPhone, setCustomerPhone] = React.useState("");
            const [paymentMode, setPaymentMode] = React.useState("Cash"); // Cash, UPI, ya Udhari
            
            // Orders Data for Owner
            const [ordersList, setOrdersList] = React.useState([]);
            const [lastBill, setLastBill] = React.useState(null);

            // Udhari Khata Data
            const [udhariList, setUdhariList] = React.useState([
                { id: 1, name: "Ramesh Kumar", phone: "9876543210", amount: 450, note: "Chawal aur Dal baki" },
                { id: 2, name: "Suresh Sharma", phone: "9123456789", amount: 1200, note: "Mahine ka rashan" }
            ]);
            const [newUdhariName, setNewUdhariName] = React.useState("");
            const [newUdhariPhone, setNewUdhariPhone] = React.useState("");
            const [newUdhariAmount, setNewUdhariAmount] = React.useState("");
            const [newUdhariNote, setNewUdhariNote] = React.useState("");

            // Rate management inputs
            const [newItemName, setNewItemName] = React.useState("");
            const [newItemPrice, setNewItemPrice] = React.useState("");
            const [newItemImg, setNewItemImg] = React.useState("");

            const addToCart = (id) => {
                setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            };

            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) {
                        updated[id] -= 1;
                    } else {
                        delete updated[id];
                    }
                    return updated;
                });
            };

            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const placeOrder = () => {
                if (!customerName || !customerPhone) {
                    alert("Kripya apna Naam aur Mobile Number likhein!");
                    return;
                }

                const totalAmt = getTotalAmount();

                let billDetails = {
                    id: Date.now(),
                    customerName,
                    customerPhone,
                    pickupTime: customerTime,
                    paymentMode,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString(),
                    items: [],
                    total: totalAmt
                };

                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        billDetails.items.push({
                            name: item.name,
                            qty: cart[id],
                            price: item.price,
                            subtotal: item.price * cart[id]
                        });
                    }
                });

                // Save to Owner Orders Data
                setOrdersList([billDetails, ...ordersList]);

                // Agar customer ne Udhari select kiya hai, toh automatic Udhari Khate mein jud jaye
                if (paymentMode === "Udhari") {
                    setUdhariList([
                        { 
                            id: Date.now(), 
                            name: customerName, 
                            phone: customerPhone, 
                            amount: totalAmt, 
                            note: "Store Order Udhari" 
                        },
                        ...udhariList
                    ]);
                }

                setLastBill(billDetails);

                // Send WhatsApp to Owner
                let message = `🛒 *Naya Order - Divya Kirana Store*\n\n`;
                message += `👤 *Grahak:* ${customerName} (${customerPhone})\n`;
                message += `⏰ *Lena hai Samay:* ${customerTime}\n`;
                message += `💳 *Payment Type:* ${paymentMode}\n\n`;
                billDetails.items.forEach(bi => {
                    message += `- ${bi.name} x ${bi.qty} = ₹${bi.subtotal}\n`;
                });
                message += `\n*Kul Rashi: ₹${totalAmt}*`;

                const url = `https://wa.me/${whatsappNo}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
                alert("✅ Order submit ho gaya! Bill niche PDF ke liye taiyar hai.");
            };

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
                    {/* Header - Triple click here for Secret Admin Access */}
                    <header onClick={handleTitleClick} className="bg-green-700 text-white p-4 shadow-md cursor-pointer select-none">
                        <h1 className="text-xl font-bold">🛒 Divya Kirana Store</h1>
                        <p className="text-xs text-green-200">Dukaan Samay: {shopOpenTime} se {shopCloseTime} (Order Karein)</p>
                    </header>

                    {/* Clean Navigation for Customers */}
                    <nav className="flex bg-green-800 text-white p-2 justify-around text-sm font-semibold">
                        <button onClick={() => setActiveTab('store')} className={`px-4 py-1 rounded ${activeTab === 'store' ? 'bg-green-600' : ''}`}>Store</button>
                        
                        {/* Admin tabs appear only after successful PIN entry */}
                        {isAdminAuthenticated && (
                            <>
                                <button onClick={() => setActiveTab('orders')} className={`px-2 py-1 rounded text-xs ${activeTab === 'orders' ? 'bg-green-600 font-bold' : ''}`}>Orders</button>
                                <button onClick={() => setActiveTab('udhari')} className={`px-2 py-1 rounded text-xs ${activeTab === 'udhari' ? 'bg-green-600 font-bold' : ''}`}>Udhari</button>
                                <button onClick={() => setActiveTab('rate')} className={`px-2 py-1 rounded text-xs ${activeTab === 'rate' ? 'bg-green-600 font-bold' : ''}`}>Rate</button>
                                <button onClick={() => setActiveTab('settings')} className={`px-2 py-1 rounded text-xs ${activeTab === 'settings' ? 'bg-green-600 font-bold' : ''}`}>Settings</button>
                            </>
                        )}
                    </nav>

                    <main className="p-4 flex-grow mb-16">
                        {/* STORE TAB */}
                        {activeTab === 'store' && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-800">Saman ki Soochi</h2>
                                <div className="space-y-3">
                                    {items.map(item => (
                                        <div key={item.id} className="flex justify-between items-center p-3 border rounded-lg shadow-sm bg-gray-50">
                                            <div className="flex items-center space-x-3">
                                                <img src={item.image} alt={item.name} className="w-12 h-12 object-cover rounded-md border" />
                                                <div>
                                                    <h3 className="font-semibold text-gray-800 text-sm">{item.name}</h3>
                                                    <p className="text-green-600 font-bold text-sm">₹{item.price}</p>
                                                </div>
                                            </div>
                                            <div>
                                                {cart[item.id] ? (
                                                    <div className="flex items-center space-x-2">
                                                        <button onClick={() => removeFromCart(item.id)} className="bg-red-500 text-white px-2 py-0.5 rounded font-bold">-</button>
                                                        <span className="text-sm">{cart[item.id]}</span>
                                                        <button onClick={() => addToCart(item.id)} className="bg-green-600 text-white px-2 py-0.5 rounded font-bold">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(item.id)} className="bg-green-700 text-white px-3 py-1 rounded text-xs font-semibold">Add</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {Object.keys(cart).length > 0 && (
                                    <div className="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg space-y-3">
                                        <h3 className="font-bold text-green-800">Total: ₹{getTotalAmount()}</h3>
                                        
                                        <div className="space-y-2 text-xs">
                                            <input type="text" placeholder="Aapka Naam" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full p-2 border rounded bg-white"/>
                                            <input type="text" placeholder="Mobile Number" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full p-2 border rounded bg-white"/>
                                            
                                            <div>
                                                <label className="font-semibold text-gray-600">Kis Samay Saman Chahiye?</label>
                                                <input type="time" value={customerTime} onChange={(e) => setCustomerTime(e.target.value)} className="w-full p-2 border rounded mt-1 bg-white"/>
                                            </div>

                                            <div>
                                                <label className="font-semibold text-gray-600">Payment Ka Tarika (Payment Mode)</label>
                                                <select value={paymentMode} onChange={(e) => setPaymentMode(e.target.value)} className="w-full p-2 border rounded mt-1 bg-white font-semibold text-green-700">
                                                    <option value="Cash">Cash (Nagad Dukan par denge)</option>
                                                    <option value="UPI">Online UPI Payment</option>
                                                    <option value="Udhari">Udhari Khata (Baad mein denge)</option>
                                                </select>
                                            </div>
                                        </div>

                                        {paymentMode === "UPI" && (
                                            <div className="text-xs bg-white p-3 rounded border text-center space-y-1">
                                                <p className="font-semibold text-gray-700">💳 Scan & Pay via UPI:</p>
                                                <p className="text-green-700 font-mono font-bold text-sm">{upiId}</p>
                                                <div className="bg-gray-100 p-2 rounded text-[11px] text-gray-500">QR Code / UPI ID par payment karke WhatsApp order bhejein</div>
                                            </div>
                                        )}

                                        <button onClick={placeOrder} className="w-full bg-green-600 text-white py-2 rounded-lg font-bold shadow text-sm hover:bg-green-700">
                                            WhatsApp par Order Bhejein & Bill Banayein 📲
                                        </button>
                                    </div>
                                )}

                                {lastBill && (
                                    <div className="mt-6 bg-white p-4 border rounded-lg shadow-sm space-y-3">
                                        <div className="text-center border-b pb-2">
                                            <h3 className="font-bold text-base text-green-700">Divya Kirana Store - Bill</h3>
                                            <p className="text-xs text-gray-500">Grahak: {lastBill.customerName} | Samay: {lastBill.pickupTime}</p>
                                            <p className="text-xs font-bold text-green-600">Payment: {lastBill.paymentMode}</p>
                                        </div>
                                        <div className="space-y-1 text-xs">
                                            {lastBill.items.map((bi, idx) => (
                                                <div key={idx} className="flex justify-between">
                                                    <span>{bi.name} (x{bi.qty})</span>
                                                    <span>₹{bi.subtotal}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="border-t pt-2 flex justify-between font-bold text-sm text-gray-800">
                                            <span>Kul Yog (Total):</span>
                                            <span className="text-green-700">₹{lastBill.total}</span>
                                        </div>
                                        <button onClick={() => window.print()} className="w-full bg-gray-800 text-white py-2 rounded font-bold text-xs">
                                            🖨️ Bill Print / Download PDF
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ORDERS / OWNER DATA TAB (Protected) */}
                        {activeTab === 'orders' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Owner Data: Saare Orders</h2>
                                {ordersList.length === 0 ? (
                                    <p className="text-sm text-gray-600">Abhi tak koi order nahi aaya hai.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {ordersList.map(ord => (
                                            <div key={ord.id} className="bg-gray-50 p-3 border rounded-lg text-xs space-y-1 shadow-sm">
                                                <div className="flex justify-between font-bold text-gray-800">
                                                    <span>{ord.customerName} ({ord.customerPhone})</span>
                                                    <span className="text-green-700">₹{ord.total}</span>
                                                </div>
                                                <p className="text-gray-500">Samay: <span className="font-semibold text-gray-700">{ord.pickupTime}</span> | Mode: <span className="font-bold text-blue-600">{ord.paymentMode}</span></p>
                                                <div className="border-t pt-1 text-gray-600">
                                                    {ord.items.map((it, i) => (
                                                        <span key={i}>{it.name} (x{it.qty}), </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* UDHARI KHATA TAB (Protected) */}
                        {activeTab === 'udhari' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Udhari Khata (Hisab-Kitab)</h2>
                                <div className="bg-gray-50 p-3 border rounded-lg space-y-2 mb-4 text-xs">
                                    <h3 className="font-bold text-gray-700">Naya Udhari Jodein</h3>
                                    <input type="text" placeholder="Grahak ka Naam" value={newUdhariName} onChange={(e) => setNewUdhariName(e.target.value)} className="w-full p-1.5 border rounded bg-white"/>
                                    <input type="text" placeholder="Mobile Number" value={newUdhariPhone} onChange={(e) => setNewUdhariPhone(e.target.value)} className="w-full p-1.5 border rounded bg-white"/>
                                    <input type="number" placeholder="Kitna Amount Baaki hai? (₹)" value={newUdhariAmount} onChange={(e) => setNewUdhariAmount(e.target.value)} className="w-full p-1.5 border rounded bg-white"/>
                                    <input type="text" placeholder="Vivarann" value={newUdhariNote} onChange={(e) => setNewUdhariNote(e.target.value)} className="w-full p-1.5 border rounded bg-white"/>
                                    <button onClick={() => {
                                        if(newUdhariName && newUdhariAmount) {
                                            setUdhariList([...udhariList, { id: Date.now(), name: newUdhariName, phone: newUdhariPhone, amount: parseFloat(newUdhariAmount), note: newUdhariNote }]);
                                            setNewUdhariName(""); setNewUdhariPhone(""); setNewUdhariAmount(""); setNewUdhariNote("");
                                            alert("Udhari jud gayi!");
                                        } else { alert("Naam aur Amount bharein."); }
                                    }} className="w-full bg-red-600 text-white py-1.5 rounded font-bold">Udhari Darj Karein</button>
                                </div>

                                <div className="space-y-2">
                                    {udhariList.map(udh => (
                                        <div key={udh.id} className="bg-white p-3 border rounded-lg shadow-sm flex justify-between items-center text-xs">
                                            <div>
                                                <h3 className="font-bold text-gray-800">{udh.name} ({udh.phone})</h3>
                                                <p className="text-gray-500">{udh.note}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-red-600 font-bold text-sm">₹{udh.amount}</p>
                                                <button onClick={() => {
                                                    setUdhariList(udhariList.filter(u => u.id !== udh.id));
                                                }} className="text-green-700 underline text-[10px]">Chukta (Clear)</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* RATE MANAGEMENT TAB (Protected) */}
                        {activeTab === 'rate' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Rate & Items Management</h2>
                                <div className="space-y-3 bg-gray-50 p-4 rounded-lg border text-xs">
                                    <input type="text" placeholder="Item ka Naam" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} className="w-full p-2 border rounded bg-white"/>
                                    <input type="number" placeholder="Rate (₹)" value={newItemPrice} onChange={(e) => setNewItemPrice(e.target.value)} className="w-full p-2 border rounded bg-white"/>
                                    <input type="text" placeholder="Image URL (Photo Link)" value={newItemImg} onChange={(e) => setNewItemImg(e.target.value)} className="w-full p-2 border rounded bg-white"/>
                                    <button onClick={() => {
                                        if(newItemName && newItemPrice) {
                                            const imgUrl = newItemImg || "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80";
                                            setItems([...items, { id: items.length + 1, name: newItemName, price: parseFloat(newItemPrice), image: imgUrl }]);
                                            setNewItemName(""); setNewItemPrice(""); setNewItemImg("");
                                            alert("Naya item jud gaya!");
                                        } else { alert("Naam aur price bharein."); }
                                    }} className="w-full bg-green-700 text-white py-2 rounded font-bold">Naya Item Jodein</button>
                                </div>
                            </div>
                        )}

                        {/* SETTINGS TAB (Protected) */}
                        {activeTab === 'settings' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Dukaan ki Settings</h2>
                                <div className="space-y-3 bg-gray-50 p-4 rounded-lg border text-xs">
                                    <div>
                                        <label className="font-semibold text-gray-600">Dukaan Khulne ka Samay</label>
                                        <input type="time" value={shopOpenTime} onChange={(e) => setShopOpenTime(e.target.value)} className="w-full p-2 border rounded mt-1 bg-white"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">Dukaan Band Hone ka Samay</label>
                                        <input type="time" value={shopCloseTime} onChange={(e) => setShopCloseTime(e.target.value)} className="w-full p-2 border rounded mt-1 bg-white"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">Owner WhatsApp Number</label>
                                        <input type="text" value={whatsappNo} onChange={(e) => setWhatsappNo(e.target.value)} className="w-full p-2 border rounded mt-1 bg-white"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">UPI ID</label>
                                        <input type="text" value={upiId} onChange={(e) => setUpiId(e.target.value)} className="w-full p-2 border rounded mt-1 bg-white"/>
                                    </div>
                                    <button onClick={() => alert("Settings Save Ho Gayi!")} className="w-full bg-green-700 text-white py-2 rounded font-bold">Save Settings</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            // Shop Settings & Timing state
            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("divyakirana@upi");
            const [shopOpenTime, setShopOpenTime] = React.useState("08:00");
            const [shopCloseTime, setShopCloseTime] = React.useState("20:00");

            // Items list
            const [items, setItems] = React.useState([
                { id: 1, name: "Aashirvaad Atta (10kg)", price: 420 },
                { id: 2, name: "Fortune Sunflower Oil (1L)", price: 135 },
                { id: 3, name: "Tata Salt (1kg)", price: 28 },
                { id: 4, name: "Surf Excel Detergent (1kg)", price: 140 },
                { id: 5, name: "Colgate Toothpaste", price: 95 }
            ]);

            const [cart, setCart] = React.useState({});
            const [newItemName, setNewItemName] = React.useState("");
            const [newItemPrice, setNewItemPrice] = React.useState("");
            const [lastBill, setLastBill] = React.useState(null);

            const handleProtectedTab = (tabName) => {
                if (tabName === 'rate' || tabName === 'settings') {
                    if (isAdminAuthenticated) {
                        setActiveTab(tabName);
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein (728084):");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            setActiveTab(tabName);
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN! Access denied.");
                        }
                    }
                } else {
                    setActiveTab(tabName);
                }
            };

            const addToCart = (id) => {
                setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            };

            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) {
                        updated[id] -= 1;
                    } else {
                        delete updated[id];
                    }
                    return updated;
                });
            };

            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const generateBill = () => {
                let billDetails = {
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString(),
                    items: [],
                    total: getTotalAmount()
                };

                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        billDetails.items.push({
                            name: item.name,
                            qty: cart[id],
                            price: item.price,
                            subtotal: item.price * cart[id]
                        });
                    }
                });

                setLastBill(billDetails);
                alert("✅ Bill taiyar ho gaya hai! Neeche PDF Bill section mein dekhein.");
            };

            const checkoutWhatsApp = () => {
                let message = "🛒 *Naya Order - Divya Kirana Store*\n\n";
                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        message += `- ${item.name} x ${cart[id]} = ₹${item.price * cart[id]}\n`;
                    }
                });
                message += `\n*Kul Rashi (Total): ₹${getTotalAmount()}*\n`;
                message += `💳 *Payment UPI ID:* ${upiId}`;
                const url = `https://wa.me/${whatsappNo}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
                    <header className="bg-green-700 text-white p-4 shadow-md">
                        <h1 className="text-xl font-bold">🛒 Divya Kirana Store</h1>
                        <p className="text-xs text-green-200">Samay: {shopOpenTime} se {shopCloseTime} tak khula hai</p>
                    </header>

                    <nav className="flex bg-green-800 text-white p-2 overflow-x-auto space-x-2 text-sm">
                        <button onClick={() => setActiveTab('store')} className={`px-3 py-1 rounded ${activeTab === 'store' ? 'bg-green-600 font-bold' : ''}`}>Store</button>
                        <button onClick={() => setActiveTab('orders')} className={`px-3 py-1 rounded ${activeTab === 'orders' ? 'bg-green-600 font-bold' : ''}`}>Bill/PDF</button>
                        <button onClick={() => setActiveTab('udhari')} className={`px-3 py-1 rounded ${activeTab === 'udhari' ? 'bg-green-600 font-bold' : ''}`}>Udhari</button>
                        <button onClick={() => handleProtectedTab('rate')} className={`px-3 py-1 rounded ${activeTab === 'rate' ? 'bg-green-600 font-bold' : ''}`}>Rate 🔒</button>
                        <button onClick={() => handleProtectedTab('settings')} className={`px-3 py-1 rounded ${activeTab === 'settings' ? 'bg-green-600 font-bold' : ''}`}>Settings 🔒</button>
                    </nav>

                    <main className="p-4 flex-grow mb-16">
                        {activeTab === 'store' && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-800">Saman ki Soochi</h2>
                                <div className="space-y-3">
                                    {items.map(item => (
                                        <div key={item.id} className="flex justify-between items-center p-3 border rounded-lg shadow-sm bg-gray-50">
                                            <div>
                                                <h3 className="font-semibold text-gray-800">{item.name}</h3>
                                                <p className="text-green-600 font-bold">₹{item.price}</p>
                                            </div>
                                            <div>
                                                {cart[item.id] ? (
                                                    <div className="flex items-center space-x-2">
                                                        <button onClick={() => removeFromCart(item.id)} className="bg-red-500 text-white px-2 py-1 rounded font-bold">-</button>
                                                        <span>{cart[item.id]}</span>
                                                        <button onClick={() => addToCart(item.id)} className="bg-green-600 text-white px-2 py-1 rounded font-bold">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(item.id)} className="bg-green-700 text-white px-3 py-1 rounded text-sm font-semibold">Add</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {Object.keys(cart).length > 0 && (
                                    <div className="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg space-y-3">
                                        <h3 className="font-bold text-green-800">Total: ₹{getTotalAmount()}</h3>
                                        <div className="text-xs text-gray-600 bg-white p-2 rounded border">
                                            <p className="font-semibold">💳 Online Payment UPI ID:</p>
                                            <p className="text-green-700 font-mono font-bold">{upiId}</p>
                                        </div>
                                        <button onClick={generateBill} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold shadow hover:bg-blue-700">
                                            📄 Bill Banayein (PDF ke liye)
                                        </button>
                                        <button onClick={checkoutWhatsApp} className="w-full bg-green-600 text-white py-2 rounded-lg font-bold shadow hover:bg-green-700">
                                            WhatsApp par Order Bhejein 📲
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'orders' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Bill & PDF Download</h2>
                                {lastBill ? (
                                    <div id="bill-section" className="bg-white p-4 border rounded-lg shadow-sm space-y-3">
                                        <div className="text-center border-b pb-2">
                                            <h3 className="font-bold text-lg text-green-700">Divya Kirana Store</h3>
                                            <p className="text-xs text-gray-500">Tarikh: {lastBill.date} | Samay: {lastBill.time}</p>
                                        </div>
                                        <div className="space-y-1 text-sm">
                                            {lastBill.items.map((bi, idx) => (
                                                <div key={idx} className="flex justify-between">
                                                    <span>{bi.name} (x{bi.qty})</span>
                                                    <span>₹{bi.subtotal}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="border-t pt-2 flex justify-between font-bold text-gray-800">
                                            <span>Kul Yog (Total):</span>
                                            <span className="text-green-700">₹{lastBill.total}</span>
                                        </div>
                                        <div className="text-xs bg-gray-50 p-2 rounded border">
                                            <p>Payment UPI: <span className="font-bold">{upiId}</span></p>
                                        </div>
                                        <button onClick={() => window.print()} className="w-full bg-gray-800 text-white py-2 rounded font-bold text-sm">
                                            🖨️ Bill Print / Save as PDF
                                        </button>
                                    </div>
                                ) : (
                                    <p className="text-gray-600 text-sm">Pehle Store mein saman select karke "Bill Banayein" par click karein.</p>
                                )}
                            </div>
                        )}

                        {activeTab === 'udhari' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Udhari Khata</h2>
                                <p className="text-gray-600">Grahakon ka hisaab-kitaab yahan surakshit rakhein.</p>
                            </div>
                        )}

                        {activeTab === 'rate' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Rate & Items Management (Protected)</h2>
                                <div className="space-y-3 bg-gray-50 p-4 rounded-lg border">
                                    <input type="text" placeholder="Item ka Naam" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} className="w-full p-2 border rounded text-sm"/>
                                    <input type="number" placeholder="Rate (₹)" value={newItemPrice} onChange={(e) => setNewItemPrice(e.target.value)} className="w-full p-2 border rounded text-sm"/>
                                    <button onClick={() => {
                                        if(newItemName && newItemPrice) {
                                            setItems([...items, { id: items.length + 1, name: newItemName, price: parseFloat(newItemPrice) }]);
                                            setNewItemName(""); setNewItemPrice("");
                                            alert("Naya item jud gaya!");
                                        } else { alert("Naam aur price bharein."); }
                                    }} className="w-full bg-green-700 text-white py-2 rounded font-bold text-sm">Naya Item Jodein</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Dukaan ki Settings (Protected)</h2>
                                <div className="space-y-3 bg-gray-50 p-4 rounded-lg border text-sm">
                                    <div>
                                        <label className="font-semibold text-gray-600">Dukaan Khulne ka Samay</label>
                                        <input type="time" value={shopOpenTime} onChange={(e) => setShopOpenTime(e.target.value)} className="w-full p-2 border rounded mt-1"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">Dukaan Band Hone ka Samay</label>
                                        <input type="time" value={shopCloseTime} onChange={(e) => setShopCloseTime(e.target.value)} className="w-full p-2 border rounded mt-1"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">WhatsApp Number</label>
                                        <input type="text" value={whatsappNo} onChange={(e) => setWhatsappNo(e.target.value)} className="w-full p-2 border rounded mt-1"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">UPI ID (Payment ke liye)</label>
                                        <input type="text" value={upiId} onChange={(e) => setUpiId(e.target.value)} className="w-full p-2 border rounded mt-1"/>
                                    </div>
                                    <button onClick={() => alert("Settings Save Ho Gayi!")} className="w-full bg-green-700 text-white py-2 rounded font-bold">Save Settings</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

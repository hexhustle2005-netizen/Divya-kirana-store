<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            // Secret Triple Tap Counter for Admin Access on Header Title
            const [titleClicks, setTitleClicks] = React.useState(0);

            const handleTitleClick = () => {
                const newClicks = titleClicks + 1;
                setTitleClicks(newClicks);
                if (newClicks >= 3) {
                    setTitleClicks(0);
                    if (isAdminAuthenticated) {
                        alert("🔓 Aap pehle se Admin mode mein hain!");
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein:");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            alert("✅ Admin Access Successful!");
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN!");
                        }
                    }
                }
            };

            // Shop Settings & Timing state
            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("divyakirana@upi");
            const [shopOpenTime, setShopOpenTime] = React.useState("08:00");
            const [shopCloseTime, setShopCloseTime] = React.useState("20:00");

            // Items list with Categories and Images
            const [items, setItems] = React.useState([
                { id: 1, name: "Aashirvaad Atta (10kg)", price: 420, category: "Groceries", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=300&q=80" },
                { id: 2, name: "Fortune Sunflower Oil (1L)", price: 135, category: "Groceries", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=300&q=80" },
                { id: 3, name: "Tata Salt (1kg)", price: 28, category: "Groceries", image: "https://images.unsplash.com/photo-1518110991417-010777ea462f?auto=format&fit=crop&w=300&q=80" },
                { id: 4, name: "DAP Khaad (50kg Bag)", price: 1350, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1628352081506-83c43123ed6d?auto=format&fit=crop&w=300&q=80" },
                { id: 5, name: "Urea Khaad (45kg Bag)", price: 266, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=300&q=80" },
                { id: 6, name: "Gehu ka Beej (40kg)", price: 1400, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1574943320219-553eb213f72d?auto=format&fit=crop&w=300&q=80" },
                { id: 7, name: "Lohe ki Kil (1kg)", price: 80, category: "Hardware", image: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=300&q=80" },
                { id: 8, name: "Hathoda (Hammer)", price: 180, category: "Hardware", image: "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=300&q=80" },
                { id: 9, name: "Disposable Thali (Pack of 50)", price: 110, category: "Pattal & Glass", image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=300&q=80" },
                { id: 10, name: "Pashu Aahar (50kg)", price: 1250, category: "Pashupalan", image: "https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=300&q=80" }
            ]);

            const [searchTerm, setSearchTerm] = React.useState("");
            const [selectedCategory, setSelectedCategory] = React.useState("All");

            const [cart, setCart] = React.useState({});
            const [customerTime, setCustomerTime] = React.useState("10:00");
            const [customerName, setCustomerName] = React.useState("");
            const [customerPhone, setCustomerPhone] = React.useState("");
            const [paymentMode, setPaymentMode] = React.useState("Cash"); 
            
            // Orders Data for Owner & Customer History
            const [ordersList, setOrdersList] = React.useState([]);
            const [customerSearchPhone, setCustomerSearchPhone] = React.useState("");
            const [myOldOrders, setMyOldOrders] = React.useState([]);
            const [lastBill, setLastBill] = React.useState(null);

            // Udhari Khata Data
            const [udhariList, setUdhariList] = React.useState([
                { id: 1, name: "Ramesh Kumar", phone: "9876543210", amount: 450, note: "Chawal aur Dal baki" },
                { id: 2, name: "Suresh Sharma", phone: "9123456789", amount: 1200, note: "Mahine ka rashan" }
            ]);
            const [newUdhariName, setNewUdhariName] = React.useState("");
            const [newUdhariPhone, setNewUdhariPhone] = React.useState("");
            const [newUdhariAmount, setNewUdhariAmount] = React.useState("");
            const [newUdhariNote, setNewUdhariNote] = React.useState("");

            // Rate management inputs
            const [newItemName, setNewItemName] = React.useState("");
            const [newItemPrice, setNewItemPrice] = React.useState("");
            const [newItemCat, setNewItemCat] = React.useState("Groceries");
            const [newItemImg, setNewItemImg] = React.useState("");

            const addToCart = (id) => {
                setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            };

            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) {
                        updated[id] -= 1;
                    } else {
                        delete updated[id];
                    }
                    return updated;
                });
            };

            const deleteItem = (id) => {
                if (confirm("Kya aap sach mein is item ko delete karna chahte hain?")) {
                    setItems(items.filter(item => item.id !== id));
                }
            };

            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const placeOrder = () => {
                if (!customerName || !customerPhone) {
                    alert("Kripya apna Naam aur Mobile Number likhein!");
                    return;
                }

                const totalAmt = getTotalAmount();

                let billDetails = {
                    id: Date.now(),
                    customerName,
                    customerPhone,
                    pickupTime: customerTime,
                    paymentMode,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString(),
                    items: [],
                    total: totalAmt
                };

                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        billDetails.items.push({
                            name: item.name,
                            qty: cart[id],
                            price: item.price,
                            subtotal: item.price * cart[id]
                        });
                    }
                });

                setOrdersList([billDetails, ...ordersList]);

                if (paymentMode === "Udhari") {
                    setUdhariList([
                        { 
                            id: Date.now(), 
                            name: customerName, 
                            phone: customerPhone, 
                            amount: totalAmt, 
                            note: "Store Order Udhari" 
                        },
                        ...udhariList
                    ]);
                }

                setLastBill(billDetails);
                setCart({});

                let message = `🛒 *Naya Order - Divya Kirana Store*\n\n`;
                message += `👤 *Grahak:* ${customerName} (${customerPhone})\n`;
                message += `⏰ *Lena hai Samay:* ${customerTime}\n`;
                message += `💳 *Payment Type:* ${paymentMode}\n\n`; billDetails.items.forEach(bi => { message += `- ${bi.name} x ${bi.qty} = ₹${bi.subtotal}\n`;
                });
                message += `\n*Kul Rashi: ₹${totalAmt}*`;

                const url = `https://wa.me/${whatsappNo}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
                alert("✅ Order submit ho gaya! Bill niche PDF ke liye taiyar hai.");
            };

            const checkMyOrders = () => {
                if (!customerSearchPhone) {
                    alert("Kripya apna mobile number dalein.");
                    return;
                }
                const found = ordersList.filter(o => o.customerPhone === customerSearchPhone);
                setMyOldOrders(found);
                if (found.length === 0) {
                    alert("Is number se koi purana order nahi mila.");
                }
            };

            const filteredItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
                return matchesSearch && matchesCat;
            });

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col font-sans">
                    {/* Header - Triple click here for Secret Admin Access */}
                    <header onClick={handleTitleClick} className="bg-gradient-to-r from-green-700 to-green-600 text-white p-4 shadow-md cursor-pointer select-none">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-extrabold tracking-wide">🛒 Divya Kirana Store</h1>
                                <p className="text-xs text-green-100">Samay: {shopOpenTime} se {shopCloseTime} (General & Agri Store)</p>
                            </div>
                            <span className="text-[10px] bg-green-800 px-2 py-1 rounded text-green-200">All-in-One</span>
                        </div>
                    </header>

                    {/* Navigation bar for Customers & Admin */}
                    <nav className="flex bg-green-900 text-white p-2 justify-around text-xs font-semibold shadow-inner">
                        <button onClick={() => setActiveTab('store')} className={`px-3 py-1 rounded transition ${activeTab === 'store' ? 'bg-green-600 shadow' : 'text-green-200'}`}>Store</button>
                        <button onClick={() => setActiveTab('myorders')} className={`px-3 py-1 rounded transition ${activeTab === 'myorders' ? 'bg-green-600 shadow' : 'text-green-200'}`}>My Orders</button>
                        
                        {isAdminAuthenticated && (
                            <>
                                <button onClick={() => setActiveTab('orders')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Owner Orders</button>
                                <button onClick={() => setActiveTab('udhari')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Udhari</button>
                                <button onClick={() => setActiveTab('rate')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Rate</button>
                                <button onClick={() => setActiveTab('settings')} className={`px-2 py-1 rounded bg-yellow-600

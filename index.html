<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-invoice, #printable-invoice * {
                visibility: visible;
            }
            #printable-invoice {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            // Secret Triple Tap Counter for Admin Access
            const [titleClicks, setTitleClicks] = React.useState(0);

            const handleTitleClick = () => {
                const newClicks = titleClicks + 1;
                setTitleClicks(newClicks);
                if (newClicks >= 3) {
                    setTitleClicks(0);
                    if (isAdminAuthenticated) {
                        alert("🔓 Aap pehle se Admin mode mein hain!");
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein:");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            alert("✅ Admin Access Successful!");
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN!");
                        }
                    }
                }
            };

            // Shop Settings & Timing state
            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("divyakirana@upi");
            const [shopOpenTime, setShopOpenTime] = React.useState("08:00");
            const [shopCloseTime, setShopCloseTime] = React.useState("20:00");

            // Items list with Categories and Images
            const [items, setItems] = React.useState([
                { id: 1, name: "Aashirvaad Atta (10kg)", price: 420, category: "Groceries", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=300&q=80" },
                { id: 2, name: "Fortune Sunflower Oil (1L)", price: 135, category: "Groceries", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=300&q=80" },
                { id: 3, name: "Tata Salt (1kg)", price: 28, category: "Groceries", image: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=300&q=80" },
                { id: 4, name: "DAP Khaad (50kg Bag)", price: 1350, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1628352081506-83c43123ed6d?auto=format&fit=crop&w=300&q=80" },
                { id: 5, name: "Urea Khaad (45kg Bag)", price: 266, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=300&q=80" },
                { id: 6, name: "Gehu ka Beej (40kg)", price: 1400, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1574943320219-553eb213f72d?auto=format&fit=crop&w=300&q=80" },
                { id: 7, name: "Lohe ki Kil (1kg)", price: 80, category: "Hardware", image: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=300&q=80" },
                { id: 8, name: "Hathoda (Hammer)", price: 180, category: "Hardware", image: "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=300&q=80" },
                { id: 9, name: "Disposable Thali (Pack of 50)", price: 110, category: "Pattal & Glass", image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=300&q=80" },
                { id: 10, name: "Pashu Aahar (50kg)", price: 1250, category: "Pashupalan", image: "https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=300&q=80" }
            ]);

            const [searchTerm, setSearchTerm] = React.useState("");
            const [selectedCategory, setSelectedCategory] = React.useState("All");

            const [cart, setCart] = React.useState({});
            const [customerTime, setCustomerTime] = React.useState("10:00");
            const [customerName, setCustomerName] = React.useState("");
            const [customerPhone, setCustomerPhone] = React.useState("");
            const [paymentMode, setPaymentMode] = React.useState("Cash"); 
            
            // Orders & History
            const [ordersList, setOrdersList] = React.useState([]);
            const [customerSearchPhone, setCustomerSearchPhone] = React.useState("");
            const [myOldOrders, setMyOldOrders] = React.useState([]);
            const [lastBill, setLastBill] = React.useState(null);

            // Udhari Khata
            const [udhariList, setUdhariList] = React.useState([
                { id: 1, name: "Ramesh Kumar", phone: "9876543210", amount: 450, note: "Chawal aur Dal baki" },
                { id: 2, name: "Suresh Sharma", phone: "9123456789", amount: 1200, note: "Mahine ka rashan" }
            ]);
            const [newUdhariName, setNewUdhariName] = React.useState("");
            const [newUdhariPhone, setNewUdhariPhone] = React.useState("");
            const [newUdhariAmount, setNewUdhariAmount] = React.useState("");
            const [newUdhariNote, setNewUdhariNote] = React.useState("");

            // Rate management inputs
            const [newItemName, setNewItemName] = React.useState("");
            const [newItemPrice, setNewItemPrice] = React.useState("");
            const [newItemCat, setNewItemCat] = React.useState("Groceries");
            const [newItemImg, setNewItemImg] = React.useState("");

            const addToCart = (id) => {
                setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            };

            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) {
                        updated[id] -= 1;
                    } else {
                        delete updated[id];
                    }
                    return updated;
                });
            };

            const deleteItem = (id) => {
                if (confirm("Kya aap sach mein is item ko delete karna chahte hain?")) {
                    setItems(items.filter(item => item.id !== id));
                }
            };

            const deleteOrder = (id) => {
                if (confirm("Kya aap is order ko delete karna chahte hain?")) {
                    setOrdersList(ordersList.filter(ord => ord.id !== id));
                }
            };

            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const placeOrder = () => {
                if (!customerName || !customerPhone) {
                    alert("Kripya apna Naam aur Mobile Number likhein!");
                    return;
                }

                const totalAmt = getTotalAmount();

                let billDetails = {
                    id: Date.now(),
                    invoiceNo: "INV-" + Math.floor(1000 + Math.random() * 9000),
                    customerName,
                    customerPhone,
                    pickupTime: customerTime,
                    paymentMode,
                    date: new Date().toLocaleDateString('en-IN'),
                    time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
                    items: [],
                    total: totalAmt
                };

                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        billDetails.items.push({
                            name: item.name,
                            qty: cart[id],
                            price: item.price,
                            subtotal: item.price * cart[id]
                        });
                    }
                });

                setOrdersList([billDetails, ...ordersList]);

                if (paymentMode === "Udhari") {
                    setUdhariList([
                        { 
                            id: Date.now(), 
                            name: customerName, 
                            phone: customerPhone, 
                            amount: totalAmt, 
                            note: "Store Order Udhari" 
                        },
                        ...udhariList
                    ]);
                }

                setLastBill(billDetails);
                setCart({});

                let message = `🛒 *Naya Order - Divya Kirana Store*\n`;
                message += `📄 *Invoice:* ${billDetails.invoiceNo}\n\n`;
                message += `👤 *Grahak:* ${customerName} (${customerPhone})\n`;
                message += `⏰ *Lena hai Samay:* ${customerTime}\n`;
                message += `💳 *Payment Type:* ${paymentMode}\n\n`;
                billDetails.items.forEach(bi => {
                    message += `- ${bi.name} x ${bi.qty} = ₹${bi.subtotal}\n`;
                });
                message += `\n*Kul Rashi: ₹${totalAmt}*`;

                const url = `https://wa.me/${whatsappNo}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
                alert("✅ Order submit ho gaya! Niche Professional Tax Invoice aur PDF Download ka button aa gaya hai.");
            };

            const checkMyOrders = () => {
                if (!customerSearchPhone) {
                    alert("Kripya apna mobile number dalein.");
                    return;
                }
                const found = ordersList.filter(o => o.customerPhone === customerSearchPhone);
                setMyOldOrders(found);
                if (found.length === 0) {
                    alert("Is number se koi purana order nahi mila.");
                }
            };

            const filteredItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
                return matchesSearch && matchesCat;
            });

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col">
                    {/* Header - Triple click for Secret Admin Access */}
                    <header onClick={handleTitleClick} className="bg-green-700 text-white p-4 shadow-md cursor-pointer select-none no-print">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-extrabold text-white tracking-wide">🛒 Divya Kirana Store</h1>
                                <p className="text-xs text-green-100 mt-0.5">Samay: {shopOpenTime} se {shopCloseTime} | General & Agri Store</p>
                            </div>
                            <span className="text-xs bg-green-900 px-2.5 py-1 rounded-full text-green-100 font-bold border border-green-500">Quick Store</span>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <nav className="flex bg-green-900 text-white p-2.5 justify-around text-xs font-bold shadow-inner no-print">
                        <button onClick={() => setActiveTab('store')} className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'store' ? 'bg-green-600 text-white shadow' : 'text-green-200 hover:text-white'}`}>Store</button>
                        <button onClick={() => setActiveTab('myorders')} className={`px-3 py-1.5 rounded-lg transition ${activeTab === 'myorders' ? 'bg-green-600 text-white shadow' : 'text-green-200 hover:text-white'}`}>My Orders</button>
                        
                        {isAdminAuthenticated && (
                            <>
                                <button onClick={() => setActiveTab('orders')} className={`px-2 py-1 rounded text-white font-bold text-xs ${activeTab === 'orders' ? 'bg-yellow-500 text-black' : 'bg-yellow-600'}`}>Orders</button>
                                <button onClick={() => setActiveTab('udhari')} className={`px-2 py-1 rounded text-white font-bold text-xs ${activeTab === 'udhari' ? 'bg-yellow-500 text-black' : 'bg-yellow-600'}`}>Udhari</button>
                                <button onClick={() => setActiveTab('rate')} className={`px-2 py-1 rounded text-white font-bold text-xs ${activeTab === 'rate' ? 'bg-yellow-500 text-black' : 'bg-yellow-600'}`}>Rate</button>
                                <button onClick={() => setActiveTab('settings')} className={`px-2 py-1 rounded text-white font-bold text-xs ${activeTab === 'settings' ? 'bg-yellow-500 text-black' : 'bg-yellow-600'}`}>Settings</button>
                            </>
                        )}
                    </nav>

                    <main className="p-4 flex-grow mb-16 bg-gray-50">
                        {/* STORE TAB */}
                        {activeTab === 'store' && (
                            <div>
                                {/* Search Bar */}
                                <div className="mb-4 no-print">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 Saman khojein (Atta, Khad, Hardware...)" 
                                        value={searchTerm} 
                                        onChange={(e) => setSearchTerm(e.target.value)} 
                                        className="w-full p-3 border border-gray-300 rounded-xl text-sm bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-green-600"
                                    />
                                </div>

                                {/* Category Filter Pills */}
                                <div className="flex space-x-2 overflow-x-auto pb-2 mb-4 text-xs no-print">
                                    {['All', 'Groceries', 'Khad & Beej', 'Hardware', 'Pattal & Glass', 'Pashupalan'].map(cat => (
                                        <button 
                                            key={cat} 
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3.5 py-2 rounded-full font-bold whitespace-nowrap shadow-sm transition ${selectedCategory === cat ? 'bg-green-700 text-white' : 'bg-white text-gray-800 border border-gray-300 hover:bg-gray-100'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                {/* Product Cards */}
                                <div className="space-y-3 no-print">
                                    {filteredItems.length === 0 ? (
                                        <p className="text-center text-gray-500 py-8 text-sm">Koi saman nahi mila.</p>
                                    ) : (
                                        filteredItems.map(item => (
                                            <div key={item.id} className="flex justify-between items-center p-3.5 border border-gray-200 rounded-2xl shadow-sm bg-white hover:shadow-md transition">
                                                <div className="flex items-center space-x-3">
                                                    <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-xl border border-gray-200 bg-gray-50" />
                                                    <div>
                                                        <span className="text-xs text-green-800 bg-green-100 px-2 py-0.5 rounded font-bold">{item.category}</span>
                                                        <h3 className="font-bold text-gray-900 text-sm mt-1">{item.name}</h3>
                                                        <p className="text-green-700 font-extrabold text-base mt-0.5">₹{item.price}</p>
                                                    </div>
                                                </div>
                                                <div>
                                                    {cart[item.id] ? (
                                                        <div className="flex items-center space-x-2 bg-green-50 p-1.5 rounded-xl border border-green-300">
                                                            <button onClick={() => removeFromCart(item.id)} className="bg-red-600 text-white w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm shadow">-</button>
                                                            <span className="text-sm font-extrabold text-green-900 px-1">{cart[item.id]}</span>
                                                            <button onClick={() => addToCart(item.id)} className="bg-green-600 text-white w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm shadow">+</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => addToCart(item.id)} className="bg-green-700 text-white px-5 py-2 rounded-xl text-xs font-extrabold shadow hover:bg-green-800 transition">ADD</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Cart Checkout Box */}
                                {Object.keys(cart).length > 0 && (
                                    <div className="mt-6 p-5 bg-white border-2 border-green-500 rounded-2xl shadow-xl space-y-3 no-print">
                                        <div className="flex justify-between items-center border-b pb-2">
                                            <h3 className="font-extrabold text-green-900 text-base">🛒 Aapka Cart</h3>
                                            <span className="font-extrabold text-green-700 text-base">Total: ₹{getTotalAmount()}</span>
                                        </div>
                                        
                                        <div className="space-y-3 text-xs">
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1">Grahak ka Naam *</label>
                                                <input type="text" placeholder="Apna pura naam likhein" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50 font-medium"/>
                                            </div>
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1">Mobile Number *</label>
                                                <input type="tel" placeholder="10 digit mobile number" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50 font-medium"/>
                                            </div>
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1">Kis Samay Saman Lena Hai?</label>
                                                <input type="time" value={customerTime} onChange={(e) => setCustomerTime(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50 font-medium"/>
                                            </div>
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1">Payment Ka Tarika</label>
                                                <select value={paymentMode} onChange={(e) => setPaymentMode(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50 font-bold text-green-800">
                                                    <option value="Cash">Cash (Nagad dukan par)</option>
                                                    <option value="UPI">Online UPI Payment</option>
                                                    <option value="Udhari">Udhari Khata (Baad mein denge)</option>
                                                </select>
                                            </div>
                                        </div>

                                        {paymentMode === "UPI" && (
                                            <div className="text-xs bg-green-50 p-3 rounded-xl border border-green-300 text-center space-y-1">
                                                <p className="font-bold text-gray-800">💳 Scan & Pay via UPI:</p>
                                                <p className="text-green-800 font-mono font-extrabold text-sm">{upiId}</p>
                                            </div>
                                        )}

                                        <button onClick={placeOrder} className="w-full bg-green-600 text-white py-3.5 rounded-xl font-extrabold shadow-lg text-sm hover:bg-green-700 transition">
                                            WhatsApp par Order Bhejein & Bill Banayein 📲
                                        </button>
                                    </div>
                                )}

                                {/* Professional Tax Invoice / Letterhead Format */}
                                {lastBill && (
                                    <div id="printable-invoice" className="mt-6 bg-white p-6 border-2 border-gray-300 rounded-2xl shadow-2xl space-y-4">
                                        <div className="text-center border-b-2 border-green-700 pb-3">
                                            <h2 className="font-black text-xl text-green-800 uppercase tracking-wider">DIVYA KIRANA STORE</h2>
                                            <p className="text-xs text-gray-600 font-medium mt-0.5">General Merchant, Khad-Beej, Hardware & Pashupalan Store</p>
                                            <div className="mt-2 inline-block bg-green-100 text-green-900 px-3 py-0.5 rounded-full text-xs font-bold">
                                                OFFICIAL TAX INVOICE / CASH MEMO
                                            </div>
                                        </div>

                                        <div className="flex justify-between text-xs text-gray-800 bg-gray-50 p-3.5 rounded-xl border border-gray-200">
                                            <div className="space-y-1">
                                                <p><strong className="text-gray-900">Invoice No:</strong> {lastBill.invoiceNo}</p>
                                                <p><strong className="text-gray-900">Grahak:</strong> {lastBill.customerName}</p>
                                                <p><strong className="text-gray-900">Mobile:</strong> {lastBill.customerPhone}</p>
                                            </div>
                                            <div className="text-right space-y-1">
                                                <p><strong className="text-gray-900">Tarikh:</strong> {lastBill.date}</p>
                                                <p><strong className="text-gray-900">Order Samay:</strong> {lastBill.time}</p>
                                                <p><strong className="text-gray-900">Pickup Time:</strong> {lastBill.pickupTime}</p>
                                            </div>
                                        </div>

                                        <div className="border border-gray-300 rounded-xl overflow-hidden text-xs">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-green-800 text-white">
                                                        <th className="p-2.5 font-bold">Saman ka Vivaran</th>
                                                        <th className="p-2.5 font-bold text-center">Matra</th>
                                                        <th className="p-2.5 font-bold text-right">Rate</th>
                                                        <th className="p-2.5 font-bold text-right">Kul</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-200">
                                                    {lastBill.items.map((bi, idx) => (
                                                        <tr key={idx} className="bg-white">
                                                            <td className="p-2.5 font-semibold text-gray-900">{bi.name}</td>
                                                            <td className="p-2.5 text-center text-gray-700 font-bold">{bi.qty}</td>
                                                            <td className="p-2.5 text-right text-gray-700">₹{bi.price}</td>
                                                            <td className="p-2.5 text-right font-bold text-gray-900">₹{bi.subtotal}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="bg-green-50 p-3.5 rounded-xl border border-green-300 flex justify-between items-center text-xs">
                                            <div>
                                                <span className="text-gray-600 block">Payment Mode:</span>
                                                <span className="text-green-900 font-extrabold text-sm">{lastBill.paymentMode}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-gray-600 block">Grand Total (Kul Rashi):</span>
                                                <span className="font-black text-green-800 text-lg">₹{lastBill.total}</span>
                                            </div>
                                        </div>

                                        <div className="text-center text-xs text-gray-500 pt-2 border-t border-dashed border-gray-300">
                                            <p className="font-semibold text-gray-700">Dhanyawad! Phir Padharein 🙏</p>
                                            <p className="text-xs text-gray-400">Computer Generated Bill - Signature Not Required</p>
                                        </div>

                                        <button onClick={() => window.print()} className="w-full bg-gray-900 text-white py-3.5 rounded-xl font-extrabold text-xs shadow-lg hover:bg-black transition no-print">
                                            🖨️ Download Bill PDF / Print Karein
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* CUSTOMER ORDER HISTORY */}
                        {activeTab === 'myorders' && (
                            <div className="space-y-4">
                                <h2 className="text-base font-extrabold text-gray-900">Mere Purane Orders</h2>
                                <p className="text-xs text-gray-600">Apna mobile number daal kar purane orders aur bills dekhein:</p>
                                <div className="flex space-x-2">
                                    <input 
                                        type="tel" 
                                        placeholder="Mobile Number Dalein" 
                                        value={customerSearchPhone} 
                                        onChange={(e) => setCustomerSearchPhone(e.target.value)} 
                                        className="flex-grow p-3 border border-gray-300 rounded-xl text-xs bg-white font-medium"
                                    />
                                    <button onClick={checkMyOrders} className="bg-green-700 text-white px-5 py-3 rounded-xl text-xs font-bold shadow hover:bg-green-800">
                                        Khojein
                                    </button>
                                </div>

                                <div className="space-y-3 mt-4">
                                    {myOldOrders.length === 0 ? (
                                        <p className="text-xs text-gray-500 text-center py-6">Koi order history nahi mili.</p>
                                    ) : (
                                        myOldOrders.map(ord => (
                                            <div key={ord.id} className="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm text-xs space-y-2">
                                                <div className="flex justify-between font-bold text-green-800 border-b pb-1.5">
                                                    <span>{ord.invoiceNo} | {ord.date}</span>
                                                    <span className="text-sm font-black text-gray-900">₹{ord.total}</span>
                                                </div>
                                                <p className="text-gray-600">Payment Mode: <strong className="text-green-700">{ord.paymentMode}</strong></p>
                                                <div className="bg-gray-50 p-2.5 rounded-xl border space-y-1">
                                                    {ord.items.map((it, idx) => (
                                                        <div key={idx} className="flex justify-between text-gray-800 font-medium">
                                                            <span>{it.name} (x{it.qty})</span>
                                                            <span>₹{it.subtotal}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button onClick={() => { setLastBill(ord); setActiveTab('store'); }} className="w-full bg-gray-800 text-white py-2 rounded-lg font-bold text-xs mt-1">
                                                    📄 Is Order ka Bill PDF Dekhein
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* OWNER ORDERS */}
                        {activeTab === 'orders' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-900">Owner Data: Saare Orders</h2>
                                {ordersList.length === 0 ? (
                                    <p className="text-sm text-gray-500 py-6 text-center">Abhi tak koi order nahi aaya hai.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {ordersList.map(ord => (
                                            <div key={ord.id} className="bg-white p-4 border border-gray-200 rounded-2xl text-xs space-y-2 shadow-sm flex justify-between items-center">
                                                <div>
                                                    <span className="text-xs font-bold text-green-700">{ord.invoiceNo}</span>
                                                    <p className="font-bold text-gray-900 text-sm">{ord.customerName} ({ord.customerPhone})</p>
                                                    <p className="text-gray-600 mt-0.5">Samay: {ord.pickupTime} | Mode: {ord.paymentMode}</p>
                                                    <p className="text-green-700 font-black text-sm mt-1">₹{ord.total}</p>
                                                </div>
                                                <button onClick={() => deleteOrder(ord.id)} className="bg-red-600 text-white px-3 py-2 rounded-xl font-bold text-xs shadow hover:bg-red-700">
                                                    🗑️ Delete
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* UDHARI */}
                        {activeTab === 'udhari' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-900">Udhari Khata</h2>
                                <div className="bg-white p-4 border border-gray-200 rounded-2xl space-y-2.5 mb-5 text-xs shadow-sm">
                                    <h3 className="font-bold text-gray-800 text-sm">Naya Udhari Jodein</h3>
                                    <input type="text" placeholder="Grahak ka Naam" value={newUdhariName} onChange={(e) => setNewUdhariName(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <input type="tel" placeholder="Mobile Number" value={newUdhariPhone} onChange={(e) => setNewUdhariPhone(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <input type="number" placeholder="Kitna Amount Baaki hai? (₹)" value={newUdhariAmount} onChange={(e) => setNewUdhariAmount(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <input type="text" placeholder="Vivarann (Note)" value={newUdhariNote} onChange={(e) => setNewUdhariNote(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <button onClick={() => {
                                        if(newUdhariName && newUdhariAmount) {
                                            setUdhariList([{ id: Date.now(), name: newUdhariName, phone: newUdhariPhone, amount: parseFloat(newUdhariAmount), note: newUdhariNote }, ...udhariList]);
                                            setNewUdhariName(""); setNewUdhariPhone(""); setNewUdhariAmount(""); setNewUdhariNote("");
                                            alert("Udhari jud gayi!");
                                        } else { alert("Naam aur Amount bharein."); }
                                    }} className="w-full bg-red-600 text-white py-2.5 rounded-xl font-bold shadow">Udhari Darj Karein</button>
                                </div>

                                <div className="space-y-3">
                                    {udhariList.map(udh => (
                                        <div key={udh.id} className="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm flex justify-between items-center text-xs">
                                            <div>
                                                <h3 className="font-bold text-gray-900 text-sm">{udh.name} ({udh.phone})</h3>
                                                <p className="text-gray-600 mt-0.5">{udh.note}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-red-600 font-black text-base">₹{udh.amount}</p>
                                                <button onClick={() => {
                                                    if(confirm("Kya is udhari ko chukta (clear) karna hai?")) {
                                                        setUdhariList(udhariList.filter(u => u.id !== udh.id));
                                                    }
                                                }} className="bg-green-700 text-white px-3 py-1.5 rounded-xl text-xs mt-1.5 font-bold shadow">Chukta (Clear)</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* RATE MANAGEMENT */}
                        {activeTab === 'rate' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-900">Rate & Items Management</h2>
                                <div className="space-y-3 bg-white p-5 border border-gray-200 rounded-2xl text-xs shadow-sm mb-6">
                                    <h3 className="font-extrabold text-gray-800 text-sm">Naya Item Jodein</h3>
                                    <input type="text" placeholder="Item ka Naam" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <input type="number" placeholder="Rate (₹)" value={newItemPrice} onChange={(e) => setNewItemPrice(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <select value={newItemCat} onChange={(e) => setNewItemCat(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50 font-bold text-gray-800">
                                        <option value="Groceries">Groceries</option>
                                        <option value="Khad & Beej">Khad & Beej</option>
                                        <option value="Hardware">Hardware</option>
                                        <option value="Pattal & Glass">Pattal & Glass</option>
                                        <option value="Pashupalan">Pashupalan</option>
                                    </select>
                                    <input type="text" placeholder="Image URL (Photo link dalein)" value={newItemImg} onChange={(e) => setNewItemImg(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    <button onClick={() => {
                                        if(newItemName && newItemPrice) {
                                            const imgUrl = newItemImg || "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80";
                                            setItems([...items, { id: Date.now(), name: newItemName, price: parseFloat(newItemPrice), category: newItemCat, image: imgUrl }]);
                                            setNewItemName(""); setNewItemPrice(""); setNewItemImg("");
                                            alert("Naya item jud gaya!");
                                        } else { alert("Naam aur price bharein."); }
                                    }} className="w-full bg-green-700 text-white py-3 rounded-xl font-bold text-xs shadow hover:bg-green-800">Naya Item Jodein</button>
                                </div>

                                <div className="space-y-3">
                                    <h3 className="font-extrabold text-gray-900 text-sm border-b pb-1.5">Maujuda Items (Delete karne ke liye):</h3>
                                    {items.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-white p-3.5 border border-gray-200 rounded-2xl shadow-sm text-xs">
                                            <div className="flex items-center space-x-3">
                                                <img src={item.image} alt={item.name} className="w-12 h-12 object-cover rounded-xl border" />
                                                <div>
                                                    <p className="font-bold text-gray-900 text-sm">{item.name}</p>
                                                    <p className="text-green-700 font-extrabold text-xs mt-0.5">₹{item.price} <span className="text-gray-500 font-normal">({item.category})</span></p>
                                                </div>
                                            </div>
                                            <button onClick={() => deleteItem(item.id)} className="bg-red-600 text-white px-3 py-2 rounded-xl font-bold text-xs shadow hover:bg-red-700">
                                                🗑️ Delete
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* SETTINGS */}
                        {activeTab === 'settings' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-900">Dukaan ki Settings</h2>
                                <div className="space-y-3 bg-white p-5 border border-gray-200 rounded-2xl text-xs shadow-sm">
                                    <div>
                                        <label className="font-bold text-gray-700 block mb-1">Dukaan Khulne ka Samay</label>
                                        <input type="time" value={shopOpenTime} onChange={(e) => setShopOpenTime(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    </div>
                                    <div>
                                        <label className="font-bold text-gray-700 block mb-1">Dukaan Band Hone ka Samay</label>
                                        <input type="time" value={shopCloseTime} onChange={(e) => setShopCloseTime(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    </div>
                                    <div>
                                        <label className="font-bold text-gray-700 block mb-1">Owner WhatsApp Number</label>
                                        <input type="text" value={whatsappNo} onChange={(e) => setWhatsappNo(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    </div>
                                    <div>
                                        <label className="font-bold text-gray-700 block mb-1">UPI ID</label>
                                        <input type="text" value={upiId} onChange={(e) => setUpiId(e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-xl bg-gray-50"/>
                                    </div>
                                    <button onClick={() => alert("Settings Save Ho Gayi!")} className="w-full bg-green-700 text-white py-3 rounded-xl font-bold shadow hover:bg-green-800">Save Settings</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            // Secret Triple Tap Counter for Admin Access on Header Title
            const [titleClicks, setTitleClicks] = React.useState(0);

            const handleTitleClick = () => {
                const newClicks = titleClicks + 1;
                setTitleClicks(newClicks);
                if (newClicks >= 3) {
                    setTitleClicks(0);
                    if (isAdminAuthenticated) {
                        alert("🔓 Aap pehle se Admin mode mein hain!");
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein:");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            alert("✅ Admin Access Successful!");
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN!");
                        }
                    }
                }
            };

            // Shop Settings & Timing state
            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("divyakirana@upi");
            const [shopOpenTime, setShopOpenTime] = React.useState("08:00");
            const [shopCloseTime, setShopCloseTime] = React.useState("20:00");

            // Items list with Categories and Images
            const [items, setItems] = React.useState([
                { id: 1, name: "Aashirvaad Atta (10kg)", price: 420, category: "Groceries", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=300&q=80" },
                { id: 2, name: "Fortune Sunflower Oil (1L)", price: 135, category: "Groceries", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=300&q=80" },
                { id: 3, name: "Tata Salt (1kg)", price: 28, category: "Groceries", image: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=300&q=80" },
                { id: 4, name: "DAP Khaad (50kg Bag)", price: 1350, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1628352081506-83c43123ed6d?auto=format&fit=crop&w=300&q=80" },
                { id: 5, name: "Urea Khaad (45kg Bag)", price: 266, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=300&q=80" },
                { id: 6, name: "Gehu ka Beej (40kg)", price: 1400, category: "Khad & Beej", image: "https://images.unsplash.com/photo-1574943320219-553eb213f72d?auto=format&fit=crop&w=300&q=80" },
                { id: 7, name: "Lohe ki Kil (1kg)", price: 80, category: "Hardware", image: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=300&q=80" },
                { id: 8, name: "Hathoda (Hammer)", price: 180, category: "Hardware", image: "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=300&q=80" },
                { id: 9, name: "Disposable Thali (Pack of 50)", price: 110, category: "Pattal & Glass", image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=300&q=80" },
                { id: 10, name: "Pashu Aahar (50kg)", price: 1250, category: "Pashupalan", image: "https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=300&q=80" }
            ]);

            const [searchTerm, setSearchTerm] = React.useState("");
            const [selectedCategory, setSelectedCategory] = React.useState("All");

            const [cart, setCart] = React.useState({});
            const [customerTime, setCustomerTime] = React.useState("10:00");
            const [customerName, setCustomerName] = React.useState("");
            const [customerPhone, setCustomerPhone] = React.useState("");
            const [paymentMode, setPaymentMode] = React.useState("Cash"); 
            
            // Orders Data for Owner & Customer History
            const [ordersList, setOrdersList] = React.useState([]);
            const [customerSearchPhone, setCustomerSearchPhone] = React.useState("");
            const [myOldOrders, setMyOldOrders] = React.useState([]);
            const [lastBill, setLastBill] = React.useState(null);

            // Udhari Khata Data
            const [udhariList, setUdhariList] = React.useState([
                { id: 1, name: "Ramesh Kumar", phone: "9876543210", amount: 450, note: "Chawal aur Dal baki" },
                { id: 2, name: "Suresh Sharma", phone: "9123456789", amount: 1200, note: "Mahine ka rashan" }
            ]);
            const [newUdhariName, setNewUdhariName] = React.useState("");
            const [newUdhariPhone, setNewUdhariPhone] = React.useState("");
            const [newUdhariAmount, setNewUdhariAmount] = React.useState("");
            const [newUdhariNote, setNewUdhariNote] = React.useState("");

            // Rate management inputs
            const [newItemName, setNewItemName] = React.useState("");
            const [newItemPrice, setNewItemPrice] = React.useState("");
            const [newItemCat, setNewItemCat] = React.useState("Groceries");
            const [newItemImg, setNewItemImg] = React.useState("");

            const addToCart = (id) => {
                setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            };

            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) {
                        updated[id] -= 1;
                    } else {
                        delete updated[id];
                    }
                    return updated;
                });
            };

            const deleteItem = (id) => {
                if (confirm("Kya aap sach mein is item ko delete karna chahte hain?")) {
                    setItems(items.filter(item => item.id !== id));
                }
            };

            const deleteOrder = (id) => {
                if (confirm("Kya aap is order ko delete karna chahte hain?")) {
                    setOrdersList(ordersList.filter(ord => ord.id !== id));
                }
            };

            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const placeOrder = () => {
                if (!customerName || !customerPhone) {
                    alert("Kripya apna Naam aur Mobile Number likhein!");
                    return;
                }

                const totalAmt = getTotalAmount();

                let billDetails = {
                    id: Date.now(),
                    customerName,
                    customerPhone,
                    pickupTime: customerTime,
                    paymentMode,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString(),
                    items: [],
                    total: totalAmt
                };

                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        billDetails.items.push({
                            name: item.name,
                            qty: cart[id],
                            price: item.price,
                            subtotal: item.price * cart[id]
                        });
                    }
                });

                setOrdersList([billDetails, ...ordersList]);

                if (paymentMode === "Udhari") {
                    setUdhariList([
                        { 
                            id: Date.now(), 
                            name: customerName, 
                            phone: customerPhone, 
                            amount: totalAmt, 
                            note: "Store Order Udhari" 
                        },
                        ...udhariList
                    ]);
                }

                setLastBill(billDetails);
                setCart({});

                let message = `🛒 *Naya Order - Divya Kirana Store*\n\n`;
                message += `👤 *Grahak:* ${customerName} (${customerPhone})\n`;
                message += `⏰ *Lena hai Samay:* ${customerTime}\n`;
                message += `💳 *Payment Type:* ${paymentMode}\n\n`;
                billDetails.items.forEach(bi => {
                    message += `- ${bi.name} x ${bi.qty} = ₹${bi.subtotal}\n`;
                });
                message += `\n*Kul Rashi: ₹${totalAmt}*`;

                const url = `https://wa.me/${whatsappNo}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
                alert("✅ Order submit ho gaya! Bill niche PDF ke liye taiyar hai.");
            };

            const checkMyOrders = () => {
                if (!customerSearchPhone) {
                    alert("Kripya apna mobile number dalein.");
                    return;
                }
                const found = ordersList.filter(o => o.customerPhone === customerSearchPhone);
                setMyOldOrders(found);
                if (found.length === 0) {
                    alert("Is number se koi purana order nahi mila.");
                }
            };

            const filteredItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
                return matchesSearch && matchesCat;
            });

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col font-sans">
                    {/* Header - Triple click here for Secret Admin Access */}
                    <header onClick={handleTitleClick} className="bg-gradient-to-r from-green-700 to-green-600 text-white p-4 shadow-md cursor-pointer select-none">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-extrabold tracking-wide">🛒 Divya Kirana Store</h1>
                                <p className="text-xs text-green-100">Samay: {shopOpenTime} se {shopCloseTime} (General & Agri Store)</p>
                            </div>
                            <span className="text-[10px] bg-green-800 px-2 py-1 rounded text-green-200">All-in-One</span>
                        </div>
                    </header>

                    {/* Navigation bar for Customers & Admin */}
                    <nav className="flex bg-green-900 text-white p-2 justify-around text-xs font-semibold shadow-inner">
                        <button onClick={() => setActiveTab('store')} className={`px-3 py-1 rounded transition ${activeTab === 'store' ? 'bg-green-600 shadow' : 'text-green-200'}`}>Store</button>
                        <button onClick={() => setActiveTab('myorders')} className={`px-3 py-1 rounded transition ${activeTab === 'myorders' ? 'bg-green-600 shadow' : 'text-green-200'}`}>My Orders</button>
                        
                        {isAdminAuthenticated && (
                            <>
                                <button onClick={() => setActiveTab('orders')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Owner Orders</button>
                                <button onClick={() => setActiveTab('udhari')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Udhari</button>
                                <button onClick={() => setActiveTab('rate')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Rate</button>
                                <button onClick={() => setActiveTab('settings')} className={`px-2 py-1 rounded bg-yellow-600 text-white font-bold`}>Settings</button>
                            </>
                        )}
                    </nav>

                    <main className="p-4 flex-grow mb-16 bg-gray-50">
                        {/* STORE TAB */}
                        {activeTab === 'store' && (
                            <div>
                                <div className="mb-3">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 Saman khojein..." 
                                        value={searchTerm} 
                                        onChange={(e) => setSearchTerm(e.target.value)} 
                                        className="w-full p-2.5 border rounded-lg text-sm bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-green-600"
                                    />
                                </div>

                                <div className="flex space-x-2 overflow-x-auto pb-2 mb-3 text-xs">
                                    {['All', 'Groceries', 'Khad & Beej', 'Hardware', 'Pattal & Glass', 'Pashupalan'].map(cat => (
                                        <button 
                                            key={cat} 
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3 py-1.5 rounded-full font-medium whitespace-nowrap shadow-sm transition ${selectedCategory === cat ? 'bg-green-700 text-white' : 'bg-white text-gray-700 border'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    {filteredItems.length === 0 ? (
                                        <p className="text-center text-gray-500 py-6 text-sm">Koi saman nahi mila.</p>
                                    ) : (
                                        filteredItems.map(item => (
                                            <div key={item.id} className="flex justify-between items-center p-3 border rounded-xl shadow-sm bg-white hover:shadow-md transition">
                                                <div className="flex items-center space-x-3">
                                                    <img src={item.image} alt={item.name} className="w-14 h-14 object-cover rounded-lg border bg-gray-100" />
                                                    <div>
                                                        <span className="text-[10px] text-green-700 bg-green-50 px-1.5 py-0.5 rounded font-bold">{item.category}</span>
                                                        <h3 className="font-bold text-gray-800 text-sm mt-0.5">{item.name}</h3>
                                                        <p className="text-green-600 font-extrabold text-sm">₹{item.price}</p>
                                                    </div>
                                                </div>
                                                <div>
                                                    {cart[item.id] ? (
                                                        <div className="flex items-center space-x-2 bg-green-50 p-1 rounded-lg border border-green-200">
                                                            <button onClick={() => removeFromCart(item.id)} className="bg-red-500 text-white w-6 h-6 rounded flex items-center justify-center font-bold text-xs">-</button>
                                                            <span className="text-sm font-bold text-green-800">{cart[item.id]}</span>
                                                            <button onClick={() => addToCart(item.id)} className="bg-green-600 text-white w-6 h-6 rounded flex items-center justify-center font-bold text-xs">+</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => addToCart(item.id)} className="bg-green-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-green-800">ADD</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {Object.keys(cart).length > 0 && (
                                    <div className="mt-6 p-4 bg-white border border-green-300 rounded-xl shadow-lg space-y-3">
                                        <div className="flex justify-between items-center border-b pb-2">
                                            <h3 className="font-extrabold text-green-800">Aapka Cart</h3>
                                            <span className="font-bold text-green-700">Total: ₹{getTotalAmount()}</span>
                                        </div>
                                        
                                        <div className="space-y-2 text-xs">
                                            <input type="text" placeholder="Aapka Naam" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full p-2 border rounded bg-gray-50"/>
                                            <input type="text" placeholder="Mobile Number" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full p-2 border rounded bg-gray-50"/>
                                            
                                            <div>
                                                <label className="font-semibold text-gray-600">Kis Samay Saman Lena Hai?</label>
                                                <input type="time" value={customerTime} onChange={(e) => setCustomerTime(e.target.value)} className="w-full p-2 border rounded mt-1 bg-gray-50"/>
                                            </div>

                                            <div>
                                                <label className="font-semibold text-gray-600">Payment Ka Tarika</label>
                                                <select value={paymentMode} onChange={(e) => setPaymentMode(e.target.value)} className="w-full p-2 border rounded mt-1 bg-gray-50 font-bold text-green-700">
                                                    <option value="Cash">Cash (Nagad dukan par)</option>
                                                    <option value="UPI">Online UPI Payment</option>
                                                    <option value="Udhari">Udhari Khata (Baad mein denge)</option>
                                                </select>
                                            </div>
                                        </div>

                                        {paymentMode === "UPI" && (
                                            <div className="text-xs bg-green-50 p-3 rounded-lg border border-green-200 text-center space-y-1">
                                                <p className="font-bold text-gray-700">💳 Scan & Pay via UPI:</p>
                                                <p className="text-green-700 font-mono font-bold text-sm">{upiId}</p>
                                            </div>
                                        )}

                                        <button onClick={placeOrder} className="w-full bg-green-600 text-white py-2.5 rounded-xl font-extrabold shadow-md text-sm hover:bg-green-700 transition">
                                            WhatsApp par Order Bhejein & Bill Banayein 📲
                                        </button>
                                    </div>
                                )}

                                {lastBill && (
                                    <div className="mt-6 bg-white p-4 border rounded-xl shadow-md space-y-3">
                                        <div className="text-center border-b pb-2">
                                            <h3 className="font-bold text-base text-green-700">Divya Kirana Store - Bill</h3>
                                            <p className="text-xs text-gray-500">Grahak: {lastBill.customerName} | Samay: {lastBill.pickupTime}</p>
                                            <p className="text-xs font-bold text-green-600">Payment: {lastBill.paymentMode}</p>
                                        </div>
                                        <div className="space-y-1 text-xs">
                                            {lastBill.items.map((bi, idx) => (
                                                <div key={idx} className="flex justify-between">
                                                    <span>{bi.name} (x{bi.qty})</span>
                                                    <span>₹{bi.subtotal}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="border-t pt-2 flex justify-between font-bold text-sm text-gray-800">
                                            <span>Kul Yog (Total):</span>
                                            <span className="text-green-700">₹{lastBill.total}</span>
                                        </div>
                                        <button onClick={() => window.print()} className="w-full bg-gray-800 text-white py-2 rounded-lg font-bold text-xs hover:bg-black transition">
                                            🖨️ Bill Print / Download PDF
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* CUSTOMER ORDER HISTORY */}
                        {activeTab === 'myorders' && (
                            <div className="space-y-4">
                                <h2 className="text-base font-extrabold text-gray-800">Mere Purane Orders</h2>
                                <div className="flex space-x-2">
                                    <input 
                                        type="text" 
                                        placeholder="Apna Mobile Number Dalein" 
                                        value={customerSearchPhone} 
                                        onChange={(e) => setCustomerSearchPhone(e.target.value)} 
                                        className="flex-grow p-2 border rounded-lg text-xs bg-white"
                                    />
                                    <button onClick={checkMyOrders} className="bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow">
                                        Khojein
                                    </button>
                                </div>

                                <div className="space-y-3 mt-4">
                                    {myOldOrders.length === 0 ? (
                                        <p className="text-xs text-gray-500 text-center py-6">Koi order history nahi mili.</p>
                                    ) : (
                                        myOldOrders.map(ord => (
                                            <div key={ord.id} className="bg-white p-3 border rounded-xl shadow-sm text-xs space-y-2">
                                                <div className="flex justify-between font-bold text-green-700 border-b pb-1">
                                                    <span>Tarikh: {ord.date}</span>
                                                    <span>₹{ord.total}</span>
                                                </div>
                                                <div className="bg-gray-50 p-2 rounded border space-y-1">
                                                    {ord.items.map((it, idx) => (
                                                        <div key={idx} className="flex justify-between text-gray-700">
                                                            <span>{it.name} (x{it.qty})</span>
                                                            <span>₹{it.subtotal}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* OWNER ORDERS */}
                        {activeTab === 'orders' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Owner Data: Saare Orders</h2>
                                {ordersList.length === 0 ? (
                                    <p className="text-sm text-gray-600">Abhi tak koi order nahi aaya hai.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {ordersList.map(ord => (
                                            <div key={ord.id} className="bg-white p-3 border rounded-xl text-xs space-y-1 shadow-sm flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-gray-800">{ord.customerName} ({ord.customerPhone})</p>
                                                    <p className="text-gray-500">Samay: {ord.pickupTime} | Mode: {ord.paymentMode}</p>
                                                    <p className="text-green-700 font-bold">₹{ord.total}</p>
                                                </div>
                                                <button onClick={() => deleteOrder(ord.id)} className="bg-red-600 text-white px-2.5 py-1.5 rounded font-bold text-[10px] shadow">
                                                    🗑️ Delete
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* UDHARI */}
                        {activeTab === 'udhari' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Udhari Khata</h2>
                                <div className="space-y-2">
                                    {udhariList.map(udh => (
                                        <div key={udh.id} className="bg-white p-3 border rounded-xl shadow-sm flex justify-between items-center text-xs">
                                            <div>
                                                <h3 className="font-bold text-gray-800">{udh.name} ({udh.phone})</h3>
                                                <p className="text-gray-500">{udh.note}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-red-600 font-bold text-sm">₹{udh.amount}</p>
                                                <button onClick={() => {
                                                    setUdhariList(udhariList.filter(u => u.id !== udh.id));
                                                }} className="bg-green-700 text-white px-2 py-1 rounded text-[10px] mt-1 font-bold">Chukta (Clear)</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* RATE MANAGEMENT (WITH CLEAR ITEM DELETE LIST) */}
                        {activeTab === 'rate' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Rate & Items Management</h2>
                                <div className="space-y-3 bg-white p-4 rounded-xl border text-xs shadow-sm mb-6">
                                    <h3 className="font-bold text-gray-700">Naya Item Jodein</h3>
                                    <input type="text" placeholder="Item ka Naam" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} className="w-full p-2 border rounded bg-gray-50"/>
                                    <input type="number" placeholder="Rate (₹)" value={newItemPrice} onChange={(e) => setNewItemPrice(e.target.value)} className="w-full p-2 border rounded bg-gray-50"/>
                                    <select value={newItemCat} onChange={(e) => setNewItemCat(e.target.value)} className="w-full p-2 border rounded bg-gray-50">
                                        <option value="Groceries">Groceries</option>
                                        <option value="Khad & Beej">Khad & Beej</option>
                                        <option value="Hardware">Hardware</option>
                                        <option value="Pattal & Glass">Pattal & Glass</option>
                                        <option value="Pashupalan">Pashupalan</option>
                                    </select>
                                    <input type="text" placeholder="Image URL (Sahi photo link dalein)" value={newItemImg} onChange={(e) => setNewItemImg(e.target.value)} className="w-full p-2 border rounded bg-gray-50"/>
                                    <button onClick={() => {
                                        if(newItemName && newItemPrice) {
                                            const imgUrl = newItemImg || "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80";
                                            setItems([...items, { id: Date.now(), name: newItemName, price: parseFloat(newItemPrice), category: newItemCat, image: imgUrl }]);
                                            setNewItemName(""); setNewItemPrice(""); setNewItemImg("");
                                            alert("Naya item jud gaya!");
                                        } else { alert("Naam aur price bharein."); }
                                    }} className="w-full bg-green-700 text-white py-2 rounded font-bold">Naya Item Jodein</button>
                                </div>

                                <div className="space-y-3">
                                    <h3 className="font-extrabold text-gray-800 text-sm border-b pb-1">Maujuda Items (Delete karne ke liye):</h3>
                                    {items.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-white p-3 border rounded-xl shadow-sm text-xs">
                                            <div className="flex items-center space-x-2">
                                                <img src={item.image} alt={item.name} className="w-10 h-10 object-cover rounded border" />
                                                <div>
                                                    <p className="font-bold text-gray-800">{item.name}</p>
                                                    <p className="text-green-600 font-bold">₹{item.price} ({item.category})</p>
                                                </div>
                                            </div>
                                            <button onClick={() => deleteItem(item.id)} className="bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow hover:bg-red-700">
                                                🗑️ Delete
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* SETTINGS */}
                        {activeTab === 'settings' && isAdminAuthenticated && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Dukaan ki Settings</h2>
                                <div className="space-y-3 bg-white p-4 rounded-xl border text-xs shadow-sm">
                                    <div>
                                        <label className="font-semibold text-gray-600">Dukaan Khulne ka Samay</label>
                                        <input type="time" value={shopOpenTime} onChange={(e) => setShopOpenTime(e.target.value)} className="w-full p-2 border rounded mt-1 bg-gray-50"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">Dukaan Band Hone ka Samay</label>
                                        <input type="time" value={shopCloseTime} onChange={(e) => setShopCloseTime(e.target.value)} className="w-full p-2 border rounded mt-1 bg-gray-50"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">Owner WhatsApp Number</label>
                                        <input type="text" value={whatsappNo} onChange={(e) => setWhatsappNo(e.target.value)} className="w-full p-2 border rounded mt-1 bg-gray-50"/>
                                    </div>
                                    <div>
                                        <label className="font-semibold text-gray-600">UPI ID</label>
                                        <input type="text" value={upiId} onChange={(e) => setUpiId(e.target.value)} className="w-full p-2 border rounded mt-1 bg-gray-50"/>
                                    </div>
                                    <button onClick={() => alert("Settings Save Ho Gayi!")} className="w-full bg-green-700 text-white py-2 rounded font-bold">Save Settings</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Kirana Store</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('store');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const ADMIN_PIN = "728084";

            // Shop Settings state
            const [whatsappNo, setWhatsappNo] = React.useState("919876543210");
            const [upiId, setUpiId] = React.useState("divyakirana@upi");

            // Items list
            const [items, setItems] = React.useState([
                { id: 1, name: "Aashirvaad Atta (10kg)", price: 420, category: "Groceries" },
                { id: 2, name: "Fortune Sunflower Oil (1L)", price: 135, category: "Groceries" },
                { id: 3, name: "Tata Salt (1kg)", price: 28, category: "Groceries" },
                { id: 4, name: "Surf Excel Detergent (1kg)", price: 140, category: "Household" },
                { id: 5, name: "Colgate Toothpaste", price: 95, category: "Personal Care" }
            ]);

            const [cart, setCart] = React.useState({});
            const [newItemName, setNewItemName] = React.useState("");
            const [newItemPrice, setNewItemPrice] = React.useState("");

            const handleProtectedTab = (tabName) => {
                if (tabName === 'rate' || tabName === 'settings') {
                    if (isAdminAuthenticated) {
                        setActiveTab(tabName);
                    } else {
                        const enteredPin = prompt("🔒 Admin PIN Dalein (728084):");
                        if (enteredPin === ADMIN_PIN) {
                            setIsAdminAuthenticated(true);
                            setActiveTab(tabName);
                        } else if (enteredPin !== null) {
                            alert("❌ Galat PIN! Access denied.");
                        }
                    }
                } else {
                    setActiveTab(tabName);
                }
            };

            const addToCart = (id) => {
                setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
            };

            const removeFromCart = (id) => {
                setCart(prev => {
                    const updated = { ...prev };
                    if (updated[id] > 1) {
                        updated[id] -= 1;
                    } else {
                        delete updated[id];
                    }
                    return updated;
                });
            };

            const getTotalAmount = () => {
                return Object.keys(cart).reduce((total, id) => {
                    const item = items.find(i => i.id === parseInt(id));
                    return total + (item ? item.price * cart[id] : 0);
                }, 0);
            };

            const checkoutWhatsApp = () => {
                let message = "🛒 *Naya Order - Divya Kirana Store*\n\n";
                Object.keys(cart).forEach(id => {
                    const item = items.find(i => i.id === parseInt(id));
                    if (item) {
                        message += `- ${item.name} x ${cart[id]} = ₹${item.price * cart[id]}\n`;
                    }
                });
                message += `\n*Kul Rashi (Total): ₹${getTotalAmount()}*`;
                const url = `https://wa.me/${whatsappNo}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
                    <header className="bg-green-700 text-white p-4 shadow-md">
                        <h1 className="text-xl font-bold">🛒 Divya Kirana Store</h1>
                        <p className="text-xs text-green-200">Online Order Karein • Dukaan se Saman Le Jayein</p>
                    </header>

                    <nav className="flex bg-green-800 text-white p-2 overflow-x-auto space-x-2 text-sm">
                        <button onClick={() => setActiveTab('store')} className={`px-3 py-1 rounded ${activeTab === 'store' ? 'bg-green-600 font-bold' : ''}`}>Store</button>
                        <button onClick={() => setActiveTab('orders')} className={`px-3 py-1 rounded ${activeTab === 'orders' ? 'bg-green-600 font-bold' : ''}`}>Orders</button>
                        <button onClick={() => setActiveTab('udhari')} className={`px-3 py-1 rounded ${activeTab === 'udhari' ? 'bg-green-600 font-bold' : ''}`}>Udhari Khata</button>
                        <button onClick={() => handleProtectedTab('rate')} className={`px-3 py-1 rounded ${activeTab === 'rate' ? 'bg-green-600 font-bold' : ''}`}>Rate & Items 🔒</button>
                        <button onClick={() => handleProtectedTab('settings')} className={`px-3 py-1 rounded ${activeTab === 'settings' ? 'bg-green-600 font-bold' : ''}`}>Settings 🔒</button>
                    </nav>

                    <main className="p-4 flex-grow mb-16">
                        {activeTab === 'store' && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-gray-800">Saman ki Soochi</h2>
                                <div className="space-y-3">
                                    {items.map(item => (
                                        <div key={item.id} className="flex justify-between items-center p-3 border rounded-lg shadow-sm bg-gray-50">
                                            <div>
                                                <h3 className="font-semibold text-gray-800">{item.name}</h3>
                                                <p className="text-green-600 font-bold">₹{item.price}</p>
                                            </div>
                                            <div>
                                                {cart[item.id] ? (
                                                    <div className="flex items-center space-x-2">
                                                        <button onClick={() => removeFromCart(item.id)} className="bg-red-500 text-white px-2 py-1 rounded font-bold">-</button>
                                                        <span>{cart[item.id]}</span>
                                                        <button onClick={() => addToCart(item.id)} className="bg-green-600 text-white px-2 py-1 rounded font-bold">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(item.id)} className="bg-green-700 text-white px-3 py-1 rounded text-sm font-semibold">Add</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                {Object.keys(cart).length > 0 && (
                                    <div className="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                        <h3 className="font-bold text-green-800">Aapka Cart (Total: ₹{getTotalAmount()})</h3>
                                        <button onClick={checkoutWhatsApp} className="mt-3 w-full bg-green-600 text-white py-2 rounded-lg font-bold shadow hover:bg-green-700">
                                            WhatsApp par Order Bhejein 📲
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'orders' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Aapke Orders</h2>
                                <p className="text-gray-600">Yahan customer dwara kiye gaye saare orders ki list dikhegi.</p>
                            </div>
                        )}

                        {activeTab === 'udhari' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Udhari Khata</h2>
                                <p className="text-gray-600">Grahakon ka hisaab-kitaab yahan surakshit rakhein.</p>
                            </div>
                        )}

                        {activeTab === 'rate' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Rate & Items Management (Protected)</h2>
                                <p className="text-gray-600 text-sm mb-4">Naye items aur rates yahan jodein:</p>
                                <div className="space-y-3 bg-gray-50 p-4 rounded-lg border">
                                    <input 
                                        type="text" 
                                        placeholder="Item ka Naam" 
                                        value={newItemName} 
                                        onChange={(e) => setNewItemName(e.target.value)} 
                                        className="w-full p-2 border rounded"
                                    />
                                    <input 
                                        type="number" 
                                        placeholder="Rate (₹)" 
                                        value={newItemPrice} 
                                        onChange={(e) => setNewItemPrice(e.target.value)} 
                                        className="w-full p-2 border rounded"
                                    />
                                    <button 
                                        onClick={() => {
                                            if(newItemName && newItemPrice) {
                                                setItems([...items, { id: items.length + 1, name: newItemName, price: parseFloat(newItemPrice) }]);
                                                setNewItemName("");
                                                setNewItemPrice("");
                                                alert("Item jodh diya gaya!");
                                            } else {
                                                alert("Kripya naam aur price dono bharein.");
                                            }
                                        }} 
                                        className="w-full bg-green-700 text-white py-2 rounded font-bold"
                                    >
                                        Naya Item Jodein
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div>
                                <h2 className="text-lg font-bold mb-2 text-gray-800">Dukaan ki Settings (Protected)</h2>
                                <div className="space-y-3 bg-gray-50 p-4 rounded-lg border">
                                    <div>
                                        <label className="text-xs font-semibold text-gray-600">WhatsApp Number (91 ke sath)</label>
                                        <input 
                                            type="text" 
                                            value={whatsappNo} 
                                            onChange={(e) => setWhatsappNo(e.target.value)} 
                                            className="w-full p-2 border rounded mt-1"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-gray-600">Shop UPI ID</label>
                                        <input 
                                            type="text" 
                                            value={upiId} 
                                            onChange={(e) => setUpiId(e.target.value)} 
                                            className="w-full p-2 border rounded mt-1"
                                        />
                                    </div>
                                    <button 
                                        onClick={() => alert("Settings Safalpurvak Save Ho Gayi!")} 
                                        className="w-full bg-green-700 text-white py-2 rounded font-bold"
                                    >
                                        Settings Save Karein
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
